<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inari Life - Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#1C2A43;--forest-2:#283A59;--sand:#F4F6F8;--cream:#FFFFFF;--ink:#1B1A17;--ink2:#4A473F;--ink3:#7C786D;--line:rgba(28,42,67,.14);--ok:#2F7D4F;--warn:#D37A33;--bad:#A32B2B;--gold:#D37A33}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:#F2EEE4;color:var(--ink);font-size:14.5px;}
.gate{position:fixed;inset:0;background:var(--forest);display:grid;place-items:center;z-index:500;padding:20px;}
.gate-box{background:var(--cream);border-radius:16px;padding:34px 30px;max-width:400px;width:100%;}
input,select,textarea{width:100%;padding:9px;margin-bottom:12px;border:1px solid var(--line);border-radius:8px;}
.btn{padding:9px 15px;border-radius:8px;font-weight:600;cursor:pointer;border:none;}
.btn-p{background:var(--forest);color:#fff;}
.btn-o{border:1px solid var(--line);background:#fff;color:var(--ink2);}
.btn-g{background:var(--gold);color:#fff;}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
.side{background:var(--forest);color:#fff;padding:20px 14px;}
.nav button{display:block;width:100%;text-align:left;padding:10px;background:none;border:none;color:#fff;cursor:pointer;margin-bottom:4px;border-radius:6px;}
.nav button:hover{background:rgba(255,255,255,.1);}
.main{padding:0;}
.topbar{padding:16px 26px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.body{padding:24px 26px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;padding:18px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;}
.drawer.open{display:block;}
.drawer-in{position:absolute;right:0;top:0;bottom:0;width:500px;background:#fff;display:flex;flex-direction:column;}
.drawer-b{padding:20px;overflow-y:auto;flex:1;}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}
.img-preview{width:100px;height:100px;object-fit:cover;border-radius:8px;margin-bottom:10px;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1 style="margin-top:0">Admin Login</h1>
    <input id="email" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Password">
    <button class="btn btn-p" style="width:100%" id="loginBtn">Login</button>
    <p id="loginErr" style="color:var(--bad);font-size:12px;margin-top:10px;"></p>
  </div>
</div>

<div class="shell" id="shell" style="display:none">
  <aside class="side">
    <div style="font-weight:bold;margin-bottom:20px;font-size:1.2rem">INARI Admin</div>
    <nav class="nav" id="nav">
      <button data-v="dash">Dashboard</button>
      <button data-v="products">Products</button>
      <button data-v="banners">Banners</button>
      <button data-v="settings">Settings / Footer</button>
    </nav>
    <div style="margin-top:auto;padding-top:30px;">
      <button id="logout" style="background:none;border:none;color:#aaa;cursor:pointer;">Logout</button>
    </div>
  </aside>
  
  <div class="main">
    <div class="topbar">
      <h2 id="viewTitle" style="margin:0">Dashboard</h2>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-o" id="btnImport">Import Initial data.json</button>
        <button class="btn btn-g" id="btnPublish">Publish Changes to Live</button>
      </div>
    </div>
    <div class="body" id="view">
        <!-- Content injected here -->
    </div>
  </div>
</div>

<!-- Drawer for Editing -->
<div class="drawer" id="drawer">
  <div class="drawer-in">
    <div style="padding:20px;border-bottom:1px solid var(--line)"><h3 style="margin:0" id="drTitle">Edit</h3></div>
    <div class="drawer-b" id="drBody"></div>
    <div class="drawer-f">
      <button class="btn btn-o" id="drCancel">Cancel</button>
      <button class="btn btn-p" id="drSave">Save to Draft</button>
    </div>
  </div>
</div>

<input type="file" id="fileIn" accept=".json" style="display:none">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDWeKTJeS3jncsALs6Ub6PRJw54W3mBPws",
    authDomain: "inari-life.firebaseapp.com",
    databaseURL: "https://inari-life-default-rtdb.firebaseio.com",
    projectId: "inari-life",
    storageBucket: "inari-life.firebasestorage.app",
    messagingSenderId: "862496820163",
    appId: "1:862496820163:web:470581a2eff13802efcb76"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const storage = getStorage(app);

  let draftData = { products: [], banners: [], settings: {} };
  
  // Auth Logic
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('shell').style.display = 'grid';
      loadDraftData();
    } else {
      document.getElementById('gate').style.display = 'grid';
      document.getElementById('shell').style.display = 'none';
    }
  });

  document.getElementById('loginBtn').onclick = () => {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pw').value;
    signInWithEmailAndPassword(auth, e, p).catch(err => {
      document.getElementById('loginErr').innerText = err.message;
    });
  };
  document.getElementById('logout').onclick = () => signOut(auth);

  // Load Data
  function loadDraftData() {
    const draftRef = ref(db, 'draft');
    onValue(draftRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        draftData = data;
        if(!draftData.products) draftData.products = [];
        if(!draftData.banners) draftData.banners = [];
        if(!draftData.settings) draftData.settings = {};
      }
      renderView();
    });
  }

  // Navigation
  let currentView = 'dash';
  document.getElementById('nav').addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON') {
      currentView = e.target.getAttribute('data-v');
      document.getElementById('viewTitle').innerText = e.target.innerText;
      renderView();
    }
  });

  function renderView() {
    const v = document.getElementById('view');
    if(currentView === 'dash') {
      v.innerHTML = `<div class="card"><h3>Welcome to Control Panel</h3><p>Manage your products, banners, and settings. Remember to click 'Publish' to push your draft changes to the live website.</p></div>`;
    } else if (currentView === 'products') {
      let html = `<div class="card"><button class="btn btn-o" id="addProdBtn">+ Add Product</button><br><br><table><thead><tr><th>Image</th><th>Name</th><th>SKU</th><th>Price/MRP</th><th>Stock</th><th>Actions</th></tr></thead><tbody>`;
      draftData.products.forEach((p, i) => {
        let disc = p.mrp > p.price ? Math.round(((p.mrp - p.price)/p.mrp)*100) + '% off' : '';
        html += `<tr>
          <td><img src="${p.image || 'https://via.placeholder.com/50'}" width="50" style="border-radius:4px"></td>
          <td><b>${p.name || 'Unnamed'}</b><br><small>${p.badge || ''}</small></td>
          <td>${p.sku || ''}</td>
          <td>₹${p.price} <strike style="color:#aaa;font-size:12px">₹${p.mrp}</strike> <br><small style="color:green">${disc}</small></td>
          <td>${p.stock > 0 ? p.stock : '<span style="color:red">Out of stock</span>'}</td>
          <td><button class="btn btn-sm btn-o edit-prod" data-i="${i}">Edit</button></td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      v.innerHTML = html;
      
      document.getElementById('addProdBtn').onclick = () => openProductEditor(null);
      document.querySelectorAll('.edit-prod').forEach(b => {
        b.onclick = (e) => openProductEditor(e.target.getAttribute('data-i'));
      });
    } else if (currentView === 'banners') {
       let html = `<div class="card"><button class="btn btn-o" id="addBannerBtn">+ Add Banner</button><br><br><table><thead><tr><th>Image</th><th>Headline</th><th>Actions</th></tr></thead><tbody>`;
      draftData.banners.forEach((b, i) => {
        html += `<tr>
          <td><img src="${b.image || 'https://via.placeholder.com/100x50'}" width="100" style="border-radius:4px"></td>
          <td>${b.title}</td>
          <td><button class="btn btn-sm btn-o edit-ban" data-i="${i}">Edit</button></td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      v.innerHTML = html;
      document.getElementById('addBannerBtn').onclick = () => openBannerEditor(null);
      document.querySelectorAll('.edit-ban').forEach(b => {
        b.onclick = (e) => openBannerEditor(e.target.getAttribute('data-i'));
      });
    } else if (currentView === 'settings') {
       v.innerHTML = `
        <div class="card">
          <h3>Store Settings & Footer</h3>
          <label>Brand Name</label>
          <input id="setBrand" value="${draftData.settings.brand || ''}">
          <label>Email</label>
          <input id="setEmail" value="${draftData.settings.email || ''}">
          <label>Phone / WhatsApp</label>
          <input id="setPhone" value="${draftData.settings.phone || ''}">
          <label>Registered Address</label>
          <textarea id="setAddr">${draftData.settings.address || ''}</textarea>
          <button class="btn btn-p" id="saveSettings">Save Settings</button>
        </div>
       `;
       document.getElementById('saveSettings').onclick = () => {
           draftData.settings.brand = document.getElementById('setBrand').value;
           draftData.settings.email = document.getElementById('setEmail').value;
           draftData.settings.phone = document.getElementById('setPhone').value;
           draftData.settings.address = document.getElementById('setAddr').value;
           set(ref(db, 'draft/settings'), draftData.settings).then(()=>alert('Settings saved to draft!'));
       };
    }
  }

  // Editors
  let editingIndex = null;
  let editingType = null;

  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
  document.getElementById('drCancel').onclick = closeDrawer;

  function openProductEditor(i) {
    editingIndex = i;
    editingType = 'product';
    let p = i !== null ? draftData.products[i] : {name:'', price:0, mrp:0, stock:0, short:'', image:'', badge:''};
    
    document.getElementById('drBody').innerHTML = `
      <label>Product Name</label>
      <input id="pName" value="${p.name || ''}">
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><label>Selling Price</label><input id="pPrice" type="number" value="${p.price}"></div>
          <div><label>MRP</label><input id="pMrp" type="number" value="${p.mrp}"></div>
      </div>
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><label>Inventory Stock</label><input id="pStock" type="number" value="${p.stock}"></div>
          <div><label>Badge (Sale, New, Popular)</label><input id="pBadge" value="${p.badge || ''}"></div>
      </div>

      <label>Short Description</label>
      <textarea id="pShort">${p.short || ''}</textarea>

      <label>Product Image / Media</label>
      <img id="imgPreview" class="img-preview" src="${p.image || 'https://via.placeholder.com/150'}" style="display:${p.image ? 'block' : 'none'}">
      <input type="file" id="pFile">
      <input type="hidden" id="pImageUrl" value="${p.image || ''}">
    `;

    document.getElementById('pFile').onchange = (e) => handleUpload(e, 'pImageUrl');
    document.getElementById('drawer').classList.add('open');
  }

  function openBannerEditor(i) {
    editingIndex = i;
    editingType = 'banner';
    let b = i !== null ? draftData.banners[i] : {title:'', subtitle:'', image:''};
    
    document.getElementById('drBody').innerHTML = `
      <label>Headline</label>
      <input id="bTitle" value="${b.title || ''}">
      <label>Sub-headline</label>
      <textarea id="bSub">${b.subtitle || ''}</textarea>
      
      <label>Banner Image</label>
      <img id="imgPreview" class="img-preview" src="${b.image || 'https://via.placeholder.com/150'}" style="display:${b.image ? 'block' : 'none'}">
      <input type="file" id="bFile">
      <input type="hidden" id="bImageUrl" value="${b.image || ''}">
    `;
    
    document.getElementById('bFile').onchange = (e) => handleUpload(e, 'bImageUrl');
    document.getElementById('drawer').classList.add('open');
  }

  function handleUpload(e, urlInputId) {
    const file = e.target.files[0];
    if(!file) return;
    
    const storageRef = sRef(storage, 'uploads/' + Date.now() + '_' + file.name);
    const uploadTask = uploadBytesResumable(storageRef, file);
    
    e.target.insertAdjacentHTML('afterend', '<span id="upStat">Uploading...</span>');
    
    uploadTask.on('state_changed', null, (err) => alert(err.message), () => {
      getDownloadURL(uploadTask.snapshot.ref).then((url) => {
        document.getElementById(urlInputId).value = url;
        document.getElementById('imgPreview').src = url;
        document.getElementById('imgPreview').style.display = 'block';
        document.getElementById('upStat').innerText = 'Uploaded!';
      });
    });
  }

  document.getElementById('drSave').onclick = () => {
    if(editingType === 'product') {
       let newP = {
           name: document.getElementById('pName').value,
           price: Number(document.getElementById('pPrice').value),
           mrp: Number(document.getElementById('pMrp').value),
           stock: Number(document.getElementById('pStock').value),
           badge: document.getElementById('pBadge').value,
           short: document.getElementById('pShort').value,
           image: document.getElementById('pImageUrl').value
       };
       if(editingIndex !== null) draftData.products[editingIndex] = {...draftData.products[editingIndex], ...newP};
       else draftData.products.push(newP);
       
       set(ref(db, 'draft/products'), draftData.products);
    } else if (editingType === 'banner') {
       let newB = {
           title: document.getElementById('bTitle').value,
           subtitle: document.getElementById('bSub').value,
           image: document.getElementById('bImageUrl').value
       };
       if(editingIndex !== null) draftData.banners[editingIndex] = {...draftData.banners[editingIndex], ...newB};
       else draftData.banners.push(newB);
       
       set(ref(db, 'draft/banners'), draftData.banners);
    }
    closeDrawer();
  };

  // Import JSON Logic
  document.getElementById('btnImport').onclick = () => document.getElementById('fileIn').click();
  document.getElementById('fileIn').onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const j = JSON.parse(evt.target.result);
        if(!j.products) throw new Error();
        set(ref(db, 'draft'), j);
        set(ref(db, 'live'), j);
        alert("Data imported successfully! Your dashboard will now populate.");
      } catch(err) {
        alert("Invalid data.json file");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // Publish Logic
  document.getElementById('btnPublish').onclick = () => {
    if(confirm("This will push all draft changes to the live website. Continue?")) {
        set(ref(db, 'live'), draftData).then(() => {
            alert("Published successfully! Refresh your storefront to see changes.");
        }).catch(err => alert("Publish error: " + err.message));
    }
  };

</script>
</body>
</html>
