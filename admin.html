<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inari Life - Control Panel (All Features)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#1C2A43;--forest-2:#283A59;--sand:#F4F6F8;--cream:#FFFFFF;--ink:#1B1A17;--ink2:#4A473F;--line:rgba(28,42,67,.14);--ok:#2F7D4F;--warn:#D37A33;--bad:#A32B2B;--gold:#D37A33}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:#F2EEE4;color:var(--ink);font-size:14px;}
.gate{position:fixed;inset:0;background:var(--forest);display:grid;place-items:center;z-index:500;padding:20px;}
.gate-box{background:var(--cream);border-radius:16px;padding:34px 30px;max-width:400px;width:100%;box-shadow:0 12px 36px rgba(0,0,0,.25);}
input,select,textarea{width:100%;padding:9px;margin-bottom:12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;}
.btn{padding:9px 15px;border-radius:8px;font-weight:600;cursor:pointer;border:none;display:inline-flex;gap:8px;align-items:center;font-size:13.5px;}
.btn-p{background:var(--forest);color:#fff;}
.btn-p:hover{background:var(--forest-2);}
.btn-o{border:1px solid var(--line);background:#fff;color:var(--ink2);}
.btn-o:hover{border-color:var(--forest);color:var(--forest);}
.btn-g{background:var(--gold);color:#fff;}
.btn-g:hover{background:#b86422;}
.btn-del{background:#ffebee;color:var(--bad);border:1px solid #ffcdd2;}
.btn-del:hover{background:#ffcdd2;}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
.side{background:var(--forest);color:#fff;padding:20px 14px;display:flex;flex-direction:column;}
.nav{flex:1;overflow-y:auto;padding-right:4px;}
.nav-sec{font-size:11px;color:#8fa1bc;text-transform:uppercase;margin:18px 0 6px 10px;letter-spacing:1.2px;font-weight:600;}
.nav button{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:none;color:#EDE4D4;cursor:pointer;margin-bottom:3px;border-radius:6px;font-size:13.5px;}
.nav button:hover, .nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
.topbar{padding:16px 26px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.body{padding:24px 26px;overflow-y:auto;height:calc(100vh - 72px);}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);}
th{font-weight:600;color:var(--ink2);background:#fafafa;}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:400;}
.drawer.open{display:block;}
.drawer-in{position:absolute;right:0;top:0;bottom:0;width:580px;background:#fff;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.15);}
.drawer-b{padding:22px;overflow-y:auto;flex:1;}
.drawer-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fbfbfb;}
.img-grid{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
.img-wrap{position:relative;width:86px;height:86px;border-radius:8px;border:1px solid var(--line);overflow:hidden;background:#fafafa;display:flex;align-items:center;justify-content:center;}
.img-wrap img{width:100%;height:100%;object-fit:cover;}
.img-wrap .seq-badge{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;}
.img-wrap button.del-img{position:absolute;top:2px;right:2px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;padding:2px 6px;line-height:1;}
.img-wrap button.mv-left{position:absolute;bottom:2px;right:22px;background:#fff;border:1px solid #ccc;border-radius:3px;cursor:pointer;font-size:9px;padding:1px 3px;}
.img-wrap button.mv-right{position:absolute;bottom:2px;right:2px;background:#fff;border:1px solid #ccc;border-radius:3px;cursor:pointer;font-size:9px;padding:1px 3px;}
.field-hint{font-size:12px;color:#666;margin-top:-6px;margin-bottom:12px;line-height:1.4;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;}
.stat-box b{font-size:22px;display:block;color:var(--forest);margin-top:4px;}
.stat-box span{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:.8px;}
.badge-tag{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.badge-active{background:#e8f5e9;color:var(--ok);}
.badge-hide{background:#f5f5f5;color:#888;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h2 style="margin-top:0;color:var(--forest);">Inari Life Admin</h2>
    <p style="font-size:13px;color:#666;margin-top:-6px;margin-bottom:18px;">Sign in to access your storefront control panel</p>
    <label style="font-size:12px;font-weight:600;">Email</label>
    <input id="email" type="email" placeholder="admin@inarilife.com">
    <label style="font-size:12px;font-weight:600;">Password</label>
    <input id="pw" type="password" placeholder="••••••••">
    <button class="btn btn-p" style="width:100%;margin-top:4px;" id="loginBtn">Login to Control Panel</button>
    <p id="loginErr" style="color:var(--bad);font-size:12px;margin-top:12px;"></p>
  </div>
</div>

<div class="shell" id="shell" style="display:none">
  <aside class="side">
    <div style="font-weight:bold;margin-bottom:14px;font-size:1.25rem;padding:0 8px;letter-spacing:1px;color:#fff;">INARI LIFE</div>
    <nav class="nav" id="nav">
      <div class="nav-sec">Store Operations</div>
      <button data-v="dash" class="active">📊 Dashboard</button>
      <button data-v="sales">📦 Sales & Enquiries</button>
      
      <div class="nav-sec">Catalog Management</div>
      <button data-v="products">🛍️ Products</button>
      <button data-v="categories">🏷️ Categories</button>
      
      <div class="nav-sec">Marketing & Content</div>
      <button data-v="promotions">🖼️ Banners & Popups</button>
      <button data-v="offers">🎟️ Offers & Coupons</button>
      <button data-v="videos">🎥 Video Library</button>
      <button data-v="testimonials">⭐ Testimonials</button>
      
      <div class="nav-sec">Configuration</div>
      <button data-v="delivery">🚚 PIN Codes & Delivery</button>
      <button data-v="settings">⚙️ Site Settings</button>
      <button data-v="emails">✉️ Email Templates</button>
      <button data-v="backup">💾 Backup & Deploy</button>
    </nav>
    <div style="padding-top:16px;border-top:1px solid rgba(255,255,255,0.12)">
      <button id="logout" style="background:none;border:none;color:#ccc;cursor:pointer;width:100%;text-align:left;padding:8px 10px;font-size:13px;">🚪 Logout</button>
    </div>
  </aside>
  
  <div class="main">
    <div class="topbar">
      <div>
        <h2 id="viewTitle" style="margin:0;font-size:1.35rem;color:var(--forest);">Dashboard</h2>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-o" id="btnPreview" onclick="window.open('index.html', '_blank')">👁️ View Live Store</button>
        <button class="btn btn-g" id="btnPublish">🚀 Publish to Live</button>
      </div>
    </div>
    <div class="body" id="view"></div>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-in">
    <div style="padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:var(--forest);" id="drTitle">Edit Item</h3>
      <span style="font-size:12px;color:#777;" id="drSubtitle">Draft Mode</span>
    </div>
    <div class="drawer-b" id="drBody"></div>
    <div class="drawer-f">
      <button class="btn btn-o" id="drCancel">Cancel</button>
      <button class="btn btn-p" id="drSave">Save to Draft</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDWeKTJeS3jncsALs6Ub6PRJw54W3mBPws",
    authDomain: "inari-life.firebaseapp.com",
    databaseURL: "https://inari-life-default-rtdb.firebaseio.com",
    projectId: "inari-life",
    storageBucket: "inari-life.firebasestorage.app",
    messagingSenderId: "862496820163",
    appId: "1:862496820163:web:470581a2eff13802efcb76"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const storage = getStorage(app);

  let draftData = {
    products: [],
    categories: [],
    banners: [],
    offers: [],
    videos: [],
    testimonials: [],
    delivery: { pincodes: [], shipCharge: 49, freeShipAbove: 499, codLimit: 5000 },
    settings: {},
    promotions: { popup: {}, strip: {} },
    emails: { templates: [] }
  };
  let liveEnquiries = [];
  
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('shell').style.display = 'grid';
      loadDraftData();
      loadLiveEnquiries();
    } else {
      document.getElementById('gate').style.display = 'grid';
      document.getElementById('shell').style.display = 'none';
    }
  });

  document.getElementById('loginBtn').onclick = () => {
    signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pw').value)
      .catch(err => document.getElementById('loginErr').innerText = err.message);
  };
  document.getElementById('logout').onclick = () => signOut(auth);

  function loadDraftData() {
    onValue(ref(db, 'draft'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        draftData = Object.assign({
          products: [],
          categories: [],
          banners: [],
          offers: [],
          videos: [],
          testimonials: [],
          delivery: { pincodes: [] },
          settings: {},
          promotions: { popup: {} },
          emails: { templates: [] }
        }, data);
        if(!draftData.delivery.pincodes) draftData.delivery.pincodes = [];
        if(!draftData.promotions) draftData.promotions = {};
        if(!draftData.emails) draftData.emails = { templates: [] };
      }
      renderView();
    });
  }

  function loadLiveEnquiries() {
    onValue(ref(db, 'live/enquiries'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        liveEnquiries = Object.keys(data).map(k => ({id:k, ...data[k]})).reverse();
      } else {
        liveEnquiries = [];
      }
      if(currentView === 'sales' || currentView === 'dash') renderView();
    });
  }

  let currentView = 'dash';
  document.getElementById('nav').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(btn && btn.getAttribute('data-v')) {
      document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.getAttribute('data-v');
      document.getElementById('viewTitle').innerText = btn.innerText.replace(/^[^\w]+/, '');
      renderView();
    }
  });

  function renderView() {
    const v = document.getElementById('view');
    let html = '';
    
    if(currentView === 'dash') {
      const activeProds = (draftData.products||[]).filter(p => Number(p.stock) > 0).length;
      html = `
        <div class="stats-grid">
          <div class="stat-box"><span>Live Products</span><b>${(draftData.products||[]).length}</b><small style="color:green">${activeProds} in stock</small></div>
          <div class="stat-box"><span>Categories</span><b>${(draftData.categories||[]).length}</b><small>Active catalog</small></div>
          <div class="stat-box"><span>Active Banners</span><b>${(draftData.banners||[]).length}</b><small>Carousel slides</small></div>
          <div class="stat-box"><span>Customer Leads</span><b>${liveEnquiries.length}</b><small>Enquiries recorded</small></div>
        </div>
        <div class="card">
          <h3 style="margin-top:0;">⚡ Quick Store Management</h3>
          <p style="color:#555;font-size:13.5px;line-height:1.6;">
            Welcome to the <b>Inari Life Central Panel</b>. Any modifications saved here remain in your <b>Draft</b> environment until you click <b>"Publish to Live"</b> above. 
          </p>
          <div style="display:flex;gap:12px;margin-top:16px;">
            <button class="btn btn-o" onclick="document.querySelector('[data-v=products]').click()">🛍️ Manage Products</button>
            <button class="btn btn-o" onclick="document.querySelector('[data-v=promotions]').click()">🖼️ Update Banners</button>
            <button class="btn btn-o" onclick="document.querySelector('[data-v=sales]').click()">📦 View Enquiries (${liveEnquiries.length})</button>
          </div>
        </div>
      `;
    } 
    else if(currentView === 'sales') {
      html = `<div class="card"><h3 style="margin-top:0;">Orders & Customer Enquiries</h3>
        <p style="color:#666;font-size:13px;margin-bottom:16px;">Direct submissions from contact forms and product enquiries on your storefront.</p>
        <table><thead><tr><th>Date</th><th>Customer Name</th><th>Email / Phone</th><th>Item / Message</th><th>Action</th></tr></thead><tbody>`;
      if(liveEnquiries.length === 0) {
        html += `<tr><td colspan="5" style="text-align:center;padding:30px;color:#999;">No enquiries or leads submitted yet.</td></tr>`;
      } else {
        liveEnquiries.forEach(eq => {
          html += `<tr>
            <td>${new Date(eq.timestamp || Date.now()).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
            <td><b>${eq.name || 'Anonymous'}</b></td>
            <td>${eq.contact || eq.email || eq.phone || '—'}</td>
            <td>${eq.message || eq.details || '—'}</td>
            <td><a href="https://wa.me/${String(eq.contact||'').replace(/\D/g,'')}" target="_blank" class="btn btn-o" style="padding:4px 10px;font-size:12px;">WhatsApp</a></td>
          </tr>`;
        });
      }
      html += `</tbody></table></div>`;
    }
    else if(currentView === 'products') {
      html = `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h3 style="margin:0;">Products Catalogue</h3>
            <span style="font-size:12px;color:#666;">Multi-image support, stock controls, and sequence manager</span>
          </div>
          <button class="btn btn-p" id="addProdBtn">+ Add New Product</button>
        </div>
        <div class="card">
          <table><thead><tr><th>Preview</th><th>Name & Category</th><th>SKU</th><th>Pricing</th><th>Stock</th><th>Actions</th></tr></thead><tbody>`;
      (draftData.products||[]).forEach((p, i) => {
        let img = (p.images && p.images.length > 0) ? p.images[0] : (p.image || 'https://via.placeholder.com/50');
        let imgCount = (p.images && p.images.length) ? p.images.length : (p.image ? 1 : 0);
        let disc = p.mrp > p.price ? Math.round(((p.mrp - p.price)/p.mrp)*100) + '% off' : '';
        html += `<tr>
          <td>
            <div style="position:relative;width:52px;height:52px;">
              <img src="${img}" width="52" height="52" style="border-radius:6px;object-fit:cover;" onerror="this.src='https://via.placeholder.com/52'">
              ${imgCount > 1 ? `<span style="position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;">+${imgCount-1}</span>` : ''}
            </div>
          </td>
          <td><b>${p.name || 'Unnamed Product'}</b><br><small style="color:#777;">${p.category || 'General'}</small></td>
          <td><code>${p.sku || '—'}</code></td>
          <td>₹${p.price || 0} <strike style="color:#aaa;font-size:11.5px">₹${p.mrp || 0}</strike> <span style="color:var(--ok);font-size:11px;font-weight:600;">${disc}</span></td>
          <td>${Number(p.stock) > 0 ? `<span class="badge-tag badge-active">${p.stock} in stock</span>` : `<span class="badge-tag badge-hide">Out of stock</span>`}</td>
          <td>
            <button class="btn btn-o edit-btn" data-type="product" data-i="${i}" style="padding:5px 12px;font-size:12px;">Edit</button>
            <button class="btn btn-del del-btn" data-type="product" data-i="${i}" style="padding:5px 10px;font-size:12px;">✕</button>
          </td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }
    else if(currentView === 'categories') {
      html = `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div><h3 style="margin:0;">Product Categories</h3><span style="font-size:12px;color:#666;">Storefront menu items & dedicated category landing pages</span></div>
          <button class="btn btn-p" id="addCatBtn">+ Add Category</button>
        </div>
        <div class="card">
          <table><thead><tr><th>Slug (URL)</th><th>Category Name</th><th>Icon</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
      (draftData.categories||[]).forEach((c, i) => {
        html += `<tr>
          <td><code>#/${c.id}</code></td>
          <td><b>${c.name}</b><br><small style="color:#777;">${c.blurb || ''}</small></td>
          <td>${c.icon || 'leaf'}</td>
          <td>${c.enabled !== false ? '<span class="badge-tag badge-active">Active</span>' : '<span class="badge-tag badge-hide">Hidden</span>'}</td>
          <td>
            <button class="btn btn-o edit-btn" data-type="category" data-i="${i}" style="padding:5px 12px;font-size:12px;">Edit</button>
            <button class="btn btn-del del-btn" data-type="category" data-i="${i}" style="padding:5px 10px;font-size:12px;">✕</button>
          </td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }
    else if(currentView === 'promotions') {
      let pop = (draftData.promotions && draftData.promotions.popup) ? draftData.promotions.popup : {};
      html = `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div><h3 style="margin:0;">Homepage Carousel Banners</h3><span style="font-size:12px;color:#666;">Top hero section sliders</span></div>
          <button class="btn btn-p" id="addBannerBtn">+ Add Banner</button>
        </div>
        <div class="card">
          <table><thead><tr><th>Preview</th><th>Headline & Subtitle</th><th>Button CTA</th><th>Actions</th></tr></thead><tbody>`;
      (draftData.banners||[]).forEach((b, i) => {
        html += `<tr>
          <td><img src="${b.image || 'https://via.placeholder.com/120x60'}" width="120" height="60" style="border-radius:6px;object-fit:cover;" onerror="this.src='https://via.placeholder.com/120x60'"></td>
          <td><b>${b.title || 'Untitled Banner'}</b><br><small style="color:#777;">${b.subtitle || ''}</small></td>
          <td><code>${b.ctaText || 'Shop'}</code> &rarr; <code>${b.ctaLink || '#/products'}</code></td>
          <td>
            <button class="btn btn-o edit-btn" data-type="banner" data-i="${i}" style="padding:5px 12px;font-size:12px;">Edit</button>
            <button class="btn btn-del del-btn" data-type="banner" data-i="${i}" style="padding:5px 10px;font-size:12px;">✕</button>
          </td>
        </tr>`;
      });
      html += `</tbody></table></div>
        
        <div class="card">
          <h3 style="margin-top:0;">Announcement Bar & Promo Popup</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <div>
              <label><b>Top Announcement Bar Message</b></label>
              <textarea id="setAnn" rows="3">${draftData.settings.announcement || ''}</textarea>
            </div>
            <div>
              <label><b>Promo Welcome Modal / Popup</b></label>
              <select id="popEn" style="margin-bottom:8px;">
                <option value="1" ${pop.enabled ? 'selected' : ''}>Popup Enabled</option>
                <option value="0" ${!pop.enabled ? 'selected' : ''}>Popup Disabled</option>
              </select>
              <input id="popTitle" placeholder="Popup Title" value="${pop.title || ''}">
              <textarea id="popBody" placeholder="Popup message/details" rows="2">${pop.body || ''}</textarea>
              <div style="display:flex;gap:10px;">
                <input id="popBtn" placeholder="Button text" value="${pop.button || 'Claim Offer'}">
                <input id="popCode" placeholder="Coupon Code" value="${pop.code || 'FIRST10'}">
              </div>
            </div>
          </div>
          <button class="btn btn-p" id="savePop" style="margin-top:10px;">Save Promotions & Popup</button>
        </div>
      `;
    }
    else if(currentView === 'offers') {
      html = `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div><h3 style="margin:0;">Offers & Discount Coupons</h3><span style="font-size:12px;color:#666;">Store coupons displayed on Offers page and cart</span></div>
          <button class="btn btn-p" id="addOffBtn">+ Add Coupon</button>
        </div>
        <div class="card">
          <table><thead><tr><th>Coupon Code</th><th>Title</th><th>Details</th><th>Expiry</th><th>Actions</th></tr></thead><tbody>`;
      (draftData.offers||[]).forEach((o, i) => {
        html += `<tr>
          <td><b style="font-family:monospace;font-size:14px;background:#eee;padding:3px 8px;border-radius:4px;">${o.code}</b></td>
          <td><b>${o.title}</b></td>
          <td>${o.detail || ''}</td>
          <td>${o.expiry || 'No Expiry'}</td>
          <td>
            <button class="btn btn-o edit-btn" data-type="offer" data-i="${i}" style="padding:5px 12px;font-size:12px;">Edit</button>

  function attachEvents() {
    document.querySelectorAll('.edit-btn').forEach(b => {
      b.onclick = (e) => openEditor(e.target.getAttribute('data-type'), e.target.getAttribute('data-i'));
    });
    
    document.querySelectorAll('.del-btn').forEach(b => {
      b.onclick = (e) => {
        const type = e.target.getAttribute('data-type');
        const i = Number(e.target.getAttribute('data-i'));
        if(confirm('Are you sure you want to delete this item from Draft?')) {
          if(type === 'product') draftData.products.splice(i, 1);
          if(type === 'category') draftData.categories.splice(i, 1);
          if(type === 'banner') draftData.banners.splice(i, 1);
          if(type === 'offer') draftData.offers.splice(i, 1);
          if(type === 'video') draftData.videos.splice(i, 1);
          if(type === 'testi') draftData.testimonials.splice(i, 1);
          set(ref(db, 'draft'), draftData).then(() => renderView());
        }
      };
    });
    
    if(document.getElementById('addProdBtn')) document.getElementById('addProdBtn').onclick = () => openEditor('product', null);
    if(document.getElementById('addCatBtn')) document.getElementById('addCatBtn').onclick = () => openEditor('category', null);
    if(document.getElementById('addBannerBtn')) document.getElementById('addBannerBtn').onclick = () => openEditor('banner', null);
    if(document.getElementById('addOffBtn')) document.getElementById('addOffBtn').onclick = () => openEditor('offer', null);
    if(document.getElementById('addVidBtn')) document.getElementById('addVidBtn').onclick = () => openEditor('video', null);
    if(document.getElementById('addTestiBtn')) document.getElementById('addTestiBtn').onclick = () => openEditor('testi', null);
    
    if(document.getElementById('saveDel')) document.getElementById('saveDel').onclick = () => {
      draftData.settings.shipCharge = Number(document.getElementById('setShipC').value);
      draftData.settings.freeShipAbove = Number(document.getElementById('setShipF').value);
      draftData.settings.codLimit = Number(document.getElementById('setCod').value);
      draftData.delivery.dispatch = document.getElementById('setDispatch').value;
      let pins = document.getElementById('setPins').value.split(',').map(s=>({pin: s.trim(), area:'India', days:3, cod:true})).filter(z=>z.pin);
      draftData.delivery.pincodes = pins;
      set(ref(db, 'draft'), draftData).then(()=>alert('Delivery settings saved to draft!'));
    };

    if(document.getElementById('saveSettings')) document.getElementById('saveSettings').onclick = () => {
      draftData.settings.brand = document.getElementById('setBrand').value;
      draftData.settings.tagline = document.getElementById('setTag').value;
      draftData.settings.email = document.getElementById('setEmail').value;
      draftData.settings.phone = document.getElementById('setPhone').value;
      draftData.settings.whatsapp = document.getElementById('setWa').value;
      draftData.settings.hours = document.getElementById('setHours').value;
      draftData.settings.address = document.getElementById('setAddr').value;
      draftData.settings.instagram = document.getElementById('setIg').value;
      draftData.settings.facebook = document.getElementById('setFb').value;
      draftData.settings.youtube = document.getElementById('setYt').value;
      draftData.settings.amazonDisclaimer = document.getElementById('setAmz').value;
      set(ref(db, 'draft'), draftData).then(()=>alert('Store settings saved to draft!'));
    };

    if(document.getElementById('savePop')) document.getElementById('savePop').onclick = () => {
      if(!draftData.promotions) draftData.promotions = {};
      if(!draftData.promotions.popup) draftData.promotions.popup = {};
      draftData.settings.announcement = document.getElementById('setAnn').value;
      draftData.promotions.popup.enabled = document.getElementById('popEn').value === '1';
      draftData.promotions.popup.title = document.getElementById('popTitle').value;
      draftData.promotions.popup.body = document.getElementById('popBody').value;
      draftData.promotions.popup.button = document.getElementById('popBtn').value;
      draftData.promotions.popup.code = document.getElementById('popCode').value;
      set(ref(db, 'draft'), draftData).then(()=>alert('Promotions saved to draft!'));
    };

    if(document.getElementById('saveEmails')) document.getElementById('saveEmails').onclick = () => {
      if(!draftData.emails) draftData.emails = {};
      draftData.emails.customerReply = document.getElementById('tplReply').value;
      draftData.emails.adminAlert = document.getElementById('tplAdmin').value;
      set(ref(db, 'draft'), draftData).then(()=>alert('Email templates saved to draft!'));
    };

    if(document.getElementById('btnBackup')) document.getElementById('btnBackup').onclick = () => {
      const blob = new Blob([JSON.stringify(draftData, null, 2)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `inari_life_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
    };

    if(document.getElementById('btnImport')) {
      document.getElementById('btnImport').onclick = () => document.getElementById('fileIn').click();
      document.getElementById('fileIn').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const j = JSON.parse(evt.target.result);
            if(!j.products && !j.settings) throw new Error();
            set(ref(db, 'draft'), j).then(() => alert('Backup restored to Draft successfully!'));
          } catch(err) {
            alert('Invalid backup JSON file.');
          }
        };
        reader.readAsText(file);
      };
    }
  }

  // Generic Drawer Editor
  let editContext = { type: null, index: null, tempImages: [] };

  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
  document.getElementById('drCancel').onclick = closeDrawer;

  function renderImageGrid() {
    let html = '';
    editContext.tempImages.forEach((img, idx) => {
      html += `
        <div class="img-wrap">
          <img src="${img}" onerror="this.src='https://via.placeholder.com/86?text=Image'">
          <span class="seq-badge">#${idx+1}</span>
          <button type="button" class="del-img" data-idx="${idx}" title="Remove image">✕</button>
          ${idx > 0 ? `<button type="button" class="mv-left" data-idx="${idx}" title="Move earlier">&larr;</button>` : ''}
          ${idx < editContext.tempImages.length - 1 ? `<button type="button" class="mv-right" data-idx="${idx}" title="Move later">&rarr;</button>` : ''}
        </div>`;
    });
    const grid = document.getElementById('imgGrid');
    if(grid) {
      grid.innerHTML = html;
      document.querySelectorAll('.del-img').forEach(b => b.onclick = (e) => {
        editContext.tempImages.splice(Number(e.target.getAttribute('data-idx')), 1);
        renderImageGrid();
      });
      document.querySelectorAll('.mv-left').forEach(b => b.onclick = (e) => {
        const idx = Number(e.target.getAttribute('data-idx'));
        const temp = editContext.tempImages[idx];
        editContext.tempImages[idx] = editContext.tempImages[idx - 1];
        editContext.tempImages[idx - 1] = temp;
        renderImageGrid();
      });
      document.querySelectorAll('.mv-right').forEach(b => b.onclick = (e) => {
        const idx = Number(e.target.getAttribute('data-idx'));
        const temp = editContext.tempImages[idx];
        editContext.tempImages[idx] = editContext.tempImages[idx + 1];
        editContext.tempImages[idx + 1] = temp;
        renderImageGrid();
      });
    }
  }

    editContext.index = i;
    
    let html = '';

      let p = i !== null ? draftData.products[i] : {name:'', price:0, mrp:0, stock:10, short:'', sku:'', badge:'', category:'home-organization', images:[]};
      editContext.tempImages = p.images ? [...p.images] : (p.image ? [p.image] : []);
      
      const catOptions = (draftData.categories||[]).map(c => `<option value="${c.id}" ${p.category===c.id?'selected':''}>${c.name}</option>`).join('');
      
      html = `

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div><label><b>Badge</b> (Sale, Bestseller, New)</label><input id="pBadge" value="${p.badge || ''}"></div>

      document.getElementById('addPathBtn').onclick = () => {

          document.getElementById('imgTextInput').value = '';

        <input id="oExp" type="date" value="${o.expiry || ''}">
      `;
      document.getElementById('drTitle').innerText = i !== null ? 'Edit Coupon' : 'Add Coupon';
      document.getElementById('drBody').innerHTML = html;
    }
    else if(type === 'video') {
      let vItem = i !== null ? draftData.videos[i] : {title:'', youtubeId:'', enabled:true};
      html = `
        <label><b>Video Title</b></label><input id="vTitle" value="${vItem.title || ''}" placeholder="e.g. How to organize storage containers">
        <label><b>YouTube Video ID (11 characters)</b></label><input id="vId" value="${vItem.youtubeId || ''}" placeholder="e.g. dQw4w9WgXcQ">
        <label><b>Status</b></label>
        <select id="vEn"><option value="1" ${vItem.enabled!==false?'selected':''}>Active</option><option value="0" ${vItem.enabled===false?'selected':''}>Hidden</option></select>
      `;
      document.getElementById('drTitle').innerText = i !== null ? 'Edit Video' : 'Add Video';
      document.getElementById('drBody').innerHTML = html;
    }
    else if(type === 'testi') {
      let tItem = i !== null ? draftData.testimonials[i] : {name:'', city:'', text:'', stars:5, enabled:true};
      html = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div><label><b>Customer Name</b></label><input id="tName" value="${tItem.name || ''}"></div>
          <div><label><b>City / Location</b></label><input id="tCity" value="${tItem.city || 'Greater Noida'}"></div>
        </div>
        <label><b>Rating Stars (1 to 5)</b></label><input id="tStars" type="number" min="1" max="5" value="${tItem.stars || 5}">
        <label><b>Review Text</b></label><textarea id="tText" rows="3">${tItem.text || ''}</textarea>
      `;
      document.getElementById('drTitle').innerText = i !== null ? 'Edit Testimonial' : 'Add Testimonial';
      document.getElementById('drBody').innerHTML = html;
    }

    document.getElementById('drawer').classList.add('open');
  };

  document.getElementById('drSave').onclick = () => {
    let t = editContext.type;
    let i = editContext.index;
    
    if(t === 'product') {
       let newP = {
         name: document.getElementById('pName').value.trim(),
         category: document.getElementById('pCat').value,
         sku: document.getElementById('pSku').value.trim(),
         price: Number(document.getElementById('pPrice').value),
         mrp: Number(document.getElementById('pMrp').value),
         stock: Number(document.getElementById('pStock').value),
         badge: document.getElementById('pBadge').value.trim(),
         amazon: document.getElementById('pAmz').value.trim(),
         short: document.getElementById('pShort').value.trim(),
         images: editContext.tempImages,
         image: editContext.tempImages[0] || ''
       };
       if(i !== null) draftData.products[i] = {...draftData.products[i], ...newP};
       else draftData.products.push(newP);
    }
    else if(t === 'category') {
       let newC = {
         id: document.getElementById('cId').value.trim(),
         name: document.getElementById('cName').value.trim(),
         blurb: document.getElementById('cBlurb').value.trim(),
         icon: document.getElementById('cIcon').value.trim(),
         enabled: document.getElementById('cEn').value === '1'
       };
       if(!draftData.categories) draftData.categories = [];
       if(i !== null) draftData.categories[i] = {...draftData.categories[i], ...newC};
       else draftData.categories.push(newC);
    }
    else if(t === 'banner') {
       const directText = document.getElementById('imgTextInput') ? document.getElementById('imgTextInput').value.trim() : '';
       const chosenImg = directText || (editContext.tempImages.length > 0 ? editContext.tempImages[0] : '');
       
       let newB = {
         eyebrow: document.getElementById('bEye').value.trim(),
         title: document.getElementById('bTitle').value.trim(),
         subtitle: document.getElementById('bSub').value.trim(),
         ctaText: document.getElementById('bCta').value.trim(),
         ctaLink: document.getElementById('bLink').value.trim(),
         image: chosenImg,
         enabled: true
       };
       if(!draftData.banners) draftData.banners = [];
       if(i !== null) draftData.banners[i] = {...draftData.banners[i], ...newB};
       else draftData.banners.push(newB);
    }
    else if(t === 'offer') {
       let newO = {
         code: document.getElementById('oCode').value.trim(),
         kind: document.getElementById('oKind').value.trim(),
         title: document.getElementById('oTitle').value.trim(),
         detail: document.getElementById('oDet').value.trim(),
         expiry: document.getElementById('oExp').value,
         enabled: true
       };
       if(!draftData.offers) draftData.offers = [];
       if(i !== null) draftData.offers[i] = {...draftData.offers[i], ...newO};
       else draftData.offers.push(newO);
    }
    else if(t === 'video') {
       let newV = {
         title: document.getElementById('vTitle').value.trim(),
         youtubeId: document.getElementById('vId').value.trim(),
         enabled: document.getElementById('vEn').value === '1'
       };
       if(!draftData.videos) draftData.videos = [];
       if(i !== null) draftData.videos[i] = {...draftData.videos[i], ...newV};
       else draftData.videos.push(newV);
    }
    else if(t === 'testi') {
       let newT = {
         name: document.getElementById('tName').value.trim(),
         city: document.getElementById('tCity').value.trim(),
         stars: Number(document.getElementById('tStars').value),
         text: document.getElementById('tText').value.trim(),
         enabled: true
       };
       if(!draftData.testimonials) draftData.testimonials = [];
       if(i !== null) draftData.testimonials[i] = {...draftData.testimonials[i], ...newT};
       else draftData.testimonials.push(newT);
    }
    
    set(ref(db, 'draft'), draftData).then(() => {
      closeDrawer();
      renderView();
    });
  };

  document.getElementById('btnPublish').onclick = () => {
    if(confirm("Publish all Draft changes live to the website? Changes will take effect immediately for all visitors upon page refresh.")) {
      set(ref(db, 'live'), draftData).then(() => alert("🎉 Changes published live successfully!"));
    }
  };
</script>
</body>
</html>
