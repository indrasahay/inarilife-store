<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inari Life — E-Commerce Control Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --forest:#1C2A43; --forest-2:#283A59; --forest-light:#eef3f9;
  --sand:#F4F6F8; --sand-2:#E9ECEF; --cream:#FFFFFF;
  --ink:#1B1A17; --ink-2:#4A473F; --ink-3:#7C786D;
  --line:rgba(28,42,67,.12);
  --ok:#2F7D4F; --warn:#D37A33; --bad:#A32B2B; --gold:#D37A33;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Inter', sans-serif; background:#F5F6F9; color:var(--ink); font-size:14px; line-height:1.5; }
button, input, select, textarea { font-family:inherit; font-size:inherit; }

/* Gate */
.gate { position:fixed; inset:0; background:radial-gradient(circle at 50% 30%, #283A59, #1C2A43); display:grid; place-items:center; z-index:1000; padding:20px; }
.gate-box { background:#fff; border-radius:16px; padding:38px 34px; max-width:420px; width:100%; box-shadow:0 24px 60px rgba(0,0,0,.35); position:relative; }
.gate-logo { font-size:20px; font-weight:800; letter-spacing:2px; color:var(--forest); margin-bottom:4px; text-transform:uppercase; }
.gate-sub { color:var(--ink-3); font-size:13px; margin-bottom:24px; }
.gate input { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:8px; margin-bottom:14px; outline:none; transition:.2s; }
.gate input:focus { border-color:var(--forest); box-shadow:0 0 0 3px rgba(28,42,67,.1); }

/* Layout */
.shell { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
.side { background:var(--forest); color:#fff; display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto; }
.side-brand { display:flex; align-items:center; gap:10px; padding:0 10px 20px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:14px; }
.side-brand b { font-size:1.15rem; letter-spacing:1.5px; font-weight:800; }
.side-brand span { font-size:10px; background:var(--gold); padding:2px 7px; border-radius:100px; font-weight:700; text-transform:uppercase; }
.nav-group-title { font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:#8fa1bc; font-weight:700; margin:18px 0 6px 10px; }
.nav button { width:100%; text-align:left; background:none; border:none; color:#d8e2ee; padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:10px; margin-bottom:3px; transition:.15s; }
.nav button:hover { background:rgba(255,255,255,.1); color:#fff; }
.nav button.active { background:rgba(255,255,255,.18); color:#fff; font-weight:600; box-shadow:inset 3px 0 0 var(--gold); }
.nav button .badge { margin-left:auto; font-size:11px; padding:2px 7px; border-radius:10px; background:rgba(255,255,255,.2); }

/* Main area */
.main { display:flex; flex-direction:column; min-width:0; }
.topbar { background:#fff; border-bottom:1px solid var(--line); padding:16px 30px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
.topbar-left h2 { font-size:1.35rem; font-weight:700; color:var(--forest); }
.topbar-left p { font-size:12px; color:var(--ink-3); margin-top:2px; }
.topbar-actions { display:flex; gap:10px; align-items:center; }
.body { padding:28px 30px; overflow-y:auto; flex:1; }

/* Buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 18px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent; transition:.15s; text-decoration:none; }
.btn-p { background:var(--forest); color:#fff; }
.btn-p:hover { background:var(--forest-2); }
.btn-p:active { transform:scale(0.98); }
.btn-p:disabled { opacity:0.6; cursor:not-allowed; }
.btn-o { background:#fff; border-color:var(--line); color:var(--ink-2); }
.btn-o:hover { border-color:var(--forest); color:var(--forest); }
.btn-g { background:var(--gold); color:#fff; }
.btn-g:hover { background:#b96728; }
.btn-del { background:#ffebee; color:var(--bad); border-color:#ffcdd2; }
.btn-del:hover { background:#ffcdd2; }
.btn-sm { padding:6px 12px; font-size:12px; border-radius:6px; }

/* Cards & UI Elements */
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:20px; box-shadow:0 2px 6px rgba(0,0,0,.03); }
.card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.card-head h3 { font-size:1.05rem; font-weight:700; color:var(--forest); }
.card-head p { font-size:12.5px; color:var(--ink-3); }

/* Form controls */
label { display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px; }
input[type="text"], input[type="number"], input[type="date"], input[type="email"], input[type="password"], select, textarea {
  width:100%; padding:9.5px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:14px; outline:none; transition:.15s; background:#fff;
}
input:focus, select:focus, textarea:focus { border-color:var(--forest); box-shadow:0 0 0 3px rgba(28,42,67,.08); }
.hint { font-size:12px; color:var(--ink-3); margin-top:-9px; margin-bottom:14px; display:block; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
.grid-4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }

/* Table */
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { padding:13px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
th { background:#fbfbfb; font-weight:600; color:var(--ink-2); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
tr:hover td { background:#fafbfc; }

/* Status Badges */
.badge { display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
.badge-ok { background:#e8f5e9; color:var(--ok); }
.badge-warn { background:#fff3e0; color:var(--warn); }
.badge-bad { background:#ffebee; color:var(--bad); }
.badge-neutral { background:#f0f2f5; color:#555; }

/* Image Sequence & Gallery Manager */
.img-manager-grid { display:flex; gap:12px; flex-wrap:wrap; margin:10px 0 16px; min-height:80px; padding:12px; background:#f9fafb; border:1px dashed var(--line); border-radius:10px; }
.img-tile { position:relative; width:92px; height:92px; border-radius:8px; border:1px solid var(--line); overflow:hidden; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.06); }
.img-tile img { width:100%; height:100%; object-fit:cover; }
.img-tile .seq { position:absolute; bottom:3px; left:3px; background:rgba(0,0,0,.7); color:#fff; font-size:10px; font-weight:700; padding:1px 5px; border-radius:4px; }
.img-tile .del { position:absolute; top:3px; right:3px; background:#e53935; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:10px; width:18px; height:18px; display:grid; place-items:center; }
.img-tile .arrows { position:absolute; bottom:3px; right:3px; display:flex; gap:2px; }
.img-tile .arrows button { background:#fff; border:1px solid #ccc; border-radius:3px; width:16px; height:16px; font-size:9px; cursor:pointer; display:grid; place-items:center; }

/* Drawer Modal */
.drawer { position:fixed; inset:0; background:rgba(18,24,38,.55); backdrop-filter:blur(3px); display:none; z-index:500; }
.drawer.open { display:block; }
.drawer-in { position:absolute; right:0; top:0; bottom:0; width:min(620px, 92vw); background:#fff; display:flex; flex-direction:column; box-shadow:-10px 0 35px rgba(0,0,0,.2); }
.drawer-h { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:#fafbfc; }
.drawer-b { padding:24px; overflow-y:auto; flex:1; }
.drawer-f { padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; background:#fafbfc; }
</style>

<!-- Firebase SDKs loaded with async/defer fallback -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>

<!-- Login Gate -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-logo">INARI LIFE</div>
    <div class="gate-sub">Control Center — Secure Cloud Access</div>
    
    <div id="cdnNotice" style="display:none;background:#fff3cd;color:#856404;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;border:1px solid #ffeeba;">
      Connecting to authentication servers...
    </div>

    <div>
      <label>Admin Email</label>
      <input id="email" type="email" placeholder="admin@inarilife.com" autocomplete="username">
      <label>Password</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="btn btn-p" style="width:100%;margin-top:4px;" id="loginBtn">Authenticate & Enter</button>
      <p id="loginErr" style="color:var(--bad);font-size:12.5px;margin-top:14px;text-align:center;font-weight:600;min-height:18px;"></p>
    </div>
  </div>
</div>

<!-- Main App Shell -->
<div class="shell" id="shell" style="display:none">
  <aside class="side">
    <div class="side-brand">
      <b>INARI LIFE</b>
      <span>CMS v3</span>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group-title">Operations</div>
      <button data-v="dash" class="active">📊 Dashboard</button>
      <button data-v="sales">📦 Sales & Leads <span class="badge" id="salesBadge">0</span></button>
      
      <div class="nav-group-title">Product Catalog</div>
      <button data-v="products">🛍️ Products</button>
      <button data-v="categories">🏷️ Categories</button>
      
      <div class="nav-group-title">Marketing & Ads</div>
      <button data-v="promotions">🖼️ Banners & Sliders</button>
      <button data-v="popup">💬 Promo Popup & Strip</button>
      <button data-v="offers">🎟️ Offers & Coupons</button>
      
      <div class="nav-group-title">Media & Social Proof</div>
      <button data-v="videos">🎥 Recipe / Video Library</button>
      <button data-v="testi">⭐ Customer Testimonials</button>
      
      <div class="nav-group-title">Configuration</div>
      <button data-v="delivery">🚚 PIN Codes & Delivery</button>
      <button data-v="settings">⚙️ Site Settings & Footer</button>
      <button data-v="emails">✉️ Email Templates & Alerts</button>
      <button data-v="backup">💾 Backup, Restore & Sync</button>
    </nav>
    <div style="margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);">
      <button id="logout" style="color:#aaa;background:none;border:none;cursor:pointer;padding:8px 10px;font-size:13px;width:100%;text-align:left;">🚪 Log Out</button>
    </div>
  </aside>
  
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h2 id="viewTitle">Dashboard</h2>
        <p id="viewSub">Overview and active operational statistics</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-o" onclick="window.open('index.html', '_blank')">👁️ Live Storefront</button>
        <button class="btn btn-g" id="btnPublish">🚀 Publish to Live</button>
      </div>
    </header>
    <main class="body" id="view">
      <!-- Dynamic View Injected Here -->
    </main>
  </div>
</div>

<!-- Modal Drawer Editor -->
<div class="drawer" id="drawer">
  <div class="drawer-in">
    <div class="drawer-h">
      <div>
        <h3 id="drTitle">Edit Item</h3>
        <span style="font-size:12px;color:var(--ink-3);" id="drSubtitle">Draft Node</span>
      </div>
      <button id="drCloseX" style="background:none;border:none;font-size:20px;cursor:pointer;color:#777;">✕</button>
    </div>
    <div class="drawer-b" id="drBody"></div>
    <div class="drawer-f">
      <button class="btn btn-o" id="drCancel">Cancel</button>
      <button class="btn btn-p" id="drSave">Save to Draft</button>
    </div>
  </div>
</div>

<script>
  // Immediate inline definition - executes immediately without waiting for any external resource
  var firebaseConfig = {
    apiKey: "AIzaSyDWeKTJeS3jncsALs6Ub6PRJw54W3mBPws",
    authDomain: "inari-life.firebaseapp.com",
    databaseURL: "https://inari-life-default-rtdb.firebaseio.com",
    projectId: "inari-life",
    storageBucket: "inari-life.firebasestorage.app",
    messagingSenderId: "862496820163",
    appId: "1:862496820163:web:470581a2eff13802efcb76"
  };

  var app = null, auth = null, db = null, storage = null;

  function initFirebase() {
    if (typeof window.firebase !== 'undefined') {
      try {
        if (!window.firebase.apps.length) {
          app = window.firebase.initializeApp(firebaseConfig);
        } else {
          app = window.firebase.app();
        }
        auth = window.firebase.auth();
        db = window.firebase.database();
        storage = window.firebase.storage();
        return true;
      } catch (e) {
        console.error("Firebase init failed:", e);
        return false;
      }
    }
    return false;
  }

  // Attempt initial setup
  initFirebase();

  var draftData = {
    products: [], categories: [], banners: [], offers: [],
    videos: [], testimonials: [],
    delivery: { pincodes: [], shipCharge: 49, freeShipAbove: 499, codLimit: 5000, dispatch: "Dispatched within 24–48 working hours" },
    settings: {},
    promotions: { popup: { enabled: false, title: "", body: "", button: "Claim code", code: "FIRST10" }, strip: { enabled: true, text: "" } },
    emails: { customerReply: "", adminAlert: "" }
  };
  var liveEnquiries = [];

  // Plain click handler attached immediately
  document.getElementById('loginBtn').addEventListener('click', function(e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var errP = document.getElementById('loginErr');
    
    // Instant visual feedback: user knows button received the click
    btn.style.opacity = '0.7';
    btn.innerText = 'Checking credentials...';
    errP.innerText = '';

    var emailVal = (document.getElementById('email').value || '').trim();
    var pwVal = (document.getElementById('pw').value || '').trim();

    if (!emailVal || !pwVal) {
      btn.style.opacity = '1';
      btn.innerText = 'Authenticate & Enter';
      errP.innerText = 'Please enter both email and password.';
      return;
    }

    if (!auth) {
      var ok = initFirebase();
      if (!ok || !auth) {
        btn.style.opacity = '1';
        btn.innerText = 'Authenticate & Enter';
        errP.innerHTML = 'Could not load Firebase. Please check your internet connection or disable Safari content blockers.';
        return;
      }
    }

    btn.disabled = true;

    auth.signInWithEmailAndPassword(emailVal, pwVal)
      .then(function(userCred) {
        btn.innerText = 'Success! Opening...';
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerText = 'Authenticate & Enter';
        console.error('Firebase Auth Error:', err);
        var msg = err.message || 'Login failed';
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
          msg = 'Incorrect email or password. Please verify in Firebase Console.';
        } else if (err.code === 'auth/user-not-found') {
          msg = 'No user registered with this email.';
        } else if (err.code === 'auth/unauthorized-domain') {
          msg = 'Domain not authorized. Please add indrasahay.github.io to Firebase Authorized Domains.';
        }
        errP.innerText = msg;
      });
  });

  // Enter key trigger on password field
  document.getElementById('pw').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') {
      document.getElementById('loginBtn').click();
    }
  });

  // Auth state listener
  function checkAuthState() {
    if (auth) {
      auth.onAuthStateChanged(function(user) {
        if (user) {
          document.getElementById('gate').style.display = 'none';
          document.getElementById('shell').style.display = 'grid';
          loadDraftData();
          loadLiveEnquiries();
        } else {
          document.getElementById('gate').style.display = 'grid';
          document.getElementById('shell').style.display = 'none';
          var btn = document.getElementById('loginBtn');
          if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerText = 'Authenticate & Enter'; }
        }
      });
    } else {
      setTimeout(function() {
        if (initFirebase()) checkAuthState();
      }, 500);
    }
  }
  checkAuthState();

  document.getElementById('logout').onclick = function() {
    if (auth) auth.signOut();
  };

  function loadDraftData() {
    if (!db) return;
    db.ref('draft').on('value', function(snapshot) {
      var data = snapshot.val();
      if (data) {
        draftData = Object.assign(draftData, data);
        if(!draftData.products) draftData.products = [];
        if(!draftData.categories) draftData.categories = [];
        if(!draftData.banners) draftData.banners = [];
        if(!draftData.offers) draftData.offers = [];
        if(!draftData.videos) draftData.videos = [];
        if(!draftData.testimonials) draftData.testimonials = [];
        if(!draftData.delivery) draftData.delivery = { pincodes:[] };
        if(!draftData.delivery.pincodes) draftData.delivery.pincodes = [];
        if(!draftData.settings) draftData.settings = {};
        if(!draftData.promotions) draftData.promotions = {};
        if(!draftData.promotions.popup) draftData.promotions.popup = {};
        if(!draftData.emails) draftData.emails = {};
      }
      renderView();
    });
  }

  function loadLiveEnquiries() {
    if (!db) return;
    db.ref('live/enquiries').on('value', function(snapshot) {
      var data = snapshot.val();
      if (data) {
        liveEnquiries = Object.keys(data).map(function(k) { return Object.assign({id:k}, data[k]); }).reverse();
      } else {
        liveEnquiries = [];
      }
      var b = document.getElementById('salesBadge');
      if(b) b.innerText = liveEnquiries.length;
      if(currentView === 'sales' || currentView === 'dash') renderView();
    });
  }

  var currentView = 'dash';
  document.getElementById('nav').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (btn && btn.getAttribute('data-v')) {
      document.querySelectorAll('#nav button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentView = btn.getAttribute('data-v');
      document.getElementById('viewTitle').innerText = btn.innerText.replace(/^[^\w]+/, '').trim();
      renderView();
    }
  });

  function renderView() {
    var v = document.getElementById('view');
    var html = '';

    // 1. DASHBOARD
    if(currentView === 'dash') {
      var inStock = draftData.products.filter(function(p) { return Number(p.stock) > 0; }).length;
      html = `
        <div class="grid-4" style="margin-bottom:24px;">
          <div class="card" style="margin:0;">
            <p style="color:var(--ink-3);font-size:12px;font-weight:600;text-transform:uppercase;">Total Products</p>
            <h2 style="font-size:2rem;color:var(--forest);margin:6px 0;">${draftData.products.length}</h2>
            <span class="badge badge-ok">${inStock} In Stock</span>
          </div>
          <div class="card" style="margin:0;">
            <p style="color:var(--ink-3);font-size:12px;font-weight:600;text-transform:uppercase;">Active Categories</p>
            <h2 style="font-size:2rem;color:var(--forest);margin:6px 0;">${draftData.categories.length}</h2>
            <span class="badge badge-neutral">Catalogue Navigation</span>
          </div>
          <div class="card" style="margin:0;">
            <p style="color:var(--ink-3);font-size:12px;font-weight:600;text-transform:uppercase;">Banners & Sliders</p>
            <h2 style="font-size:2rem;color:var(--forest);margin:6px 0;">${draftData.banners.length}</h2>
            <span class="badge badge-ok">Hero Section</span>
          </div>
          <div class="card" style="margin:0;">
            <p style="color:var(--ink-3);font-size:12px;font-weight:600;text-transform:uppercase;">Customer Enquiries</p>
            <h2 style="font-size:2rem;color:var(--gold);margin:6px 0;">${liveEnquiries.length}</h2>
            <span class="badge badge-warn">Inbound Leads</span>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div>
              <h3>Quick Store Actions</h3>
              <p>Direct shortcuts to high-frequency management tools</p>
            </div>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn btn-p" onclick="openEditor('product', null)">+ Add New Product</button>
            <button class="btn btn-o" onclick="openEditor('banner', null)">+ Add Banner Slider</button>
            <button class="btn btn-o" onclick="openEditor('offer', null)">+ Add Coupon Code</button>
            <button class="btn btn-o" onclick="document.querySelector('[data-v=sales]').click()">View Recent Leads (${liveEnquiries.length})</button>
            <button class="btn btn-g" id="btnPublishDash">Publish All Changes Live</button>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div>
              <h3>Recent Store Inquiries & Orders</h3>
              <p>Latest customer inquiries captured from the front end</p>
            </div>
            <button class="btn btn-o btn-sm" onclick="document.querySelector('[data-v=sales]').click()">View All</button>
          </div>
          <table>
            <thead><tr><th>Timestamp</th><th>Customer</th><th>Contact</th><th>Inquiry Message</th><th>Quick Action</th></tr></thead>
            <tbody>
              ${liveEnquiries.slice(0, 5).map(function(eq) {
                return `
                <tr>
                  <td>${new Date(eq.timestamp || Date.now()).toLocaleDateString('en-IN', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
                  <td><b>${eq.name || 'Anonymous'}</b></td>
                  <td>${eq.contact || eq.email || '—'}</td>
                  <td>${(eq.message || eq.details || '—').slice(0, 60)}...</td>
                  <td><a href="https://wa.me/${String(eq.contact||'').replace(/\D/g,'')}" target="_blank" class="btn btn-o btn-sm">WhatsApp</a></td>
                </tr>`;

  function attachEvents() {
    // Edit & Delete Handlers
    document.querySelectorAll('.edit-btn').forEach(function(b) {
      b.onclick = function(e) { openEditor(e.target.getAttribute('data-type'), Number(e.target.getAttribute('data-i'))); };
    });

    document.querySelectorAll('.del-btn').forEach(function(b) {
      b.onclick = function(e) {
        var type = e.target.getAttribute('data-type');
        var i = Number(e.target.getAttribute('data-i'));
        if(confirm(`Are you sure you want to remove this ${type}? This affects your Draft database.`)) {
          if(type === 'product') draftData.products.splice(i, 1);
          if(type === 'category') draftData.categories.splice(i, 1);
          if(type === 'banner') draftData.banners.splice(i, 1);
          if(type === 'offer') draftData.offers.splice(i, 1);
          if(type === 'video') draftData.videos.splice(i, 1);
          if(type === 'testi') draftData.testimonials.splice(i, 1);
          if (db) db.ref('draft').set(draftData).then(function() { renderView(); });
        }
      };
    });

    // Add Buttons
    if(document.getElementById('addProdBtn')) document.getElementById('addProdBtn').onclick = function() { openEditor('product', null); };
    if(document.getElementById('addCatBtn')) document.getElementById('addCatBtn').onclick = function() { openEditor('category', null); };
    if(document.getElementById('addBannerBtn')) document.getElementById('addBannerBtn').onclick = function() { openEditor('banner', null); };
    if(document.getElementById('addOffBtn')) document.getElementById('addOffBtn').onclick = function() { openEditor('offer', null); };
    if(document.getElementById('addVidBtn')) document.getElementById('addVidBtn').onclick = function() { openEditor('video', null); };
    if(document.getElementById('addTestiBtn')) document.getElementById('addTestiBtn').onclick = function() { openEditor('testi', null); };

    // Save Section Handlers
    if(document.getElementById('savePop')) document.getElementById('savePop').onclick = function() {
      draftData.settings.announcement = document.getElementById('setAnn').value;
      draftData.promotions.popup.enabled = document.getElementById('popEn').value === '1';
      draftData.promotions.popup.title = document.getElementById('popTitle').value;
      draftData.promotions.popup.body = document.getElementById('popBody').value;
      draftData.promotions.popup.button = document.getElementById('popBtn').value;
      draftData.promotions.popup.code = document.getElementById('popCode').value;
      if (db) db.ref('draft').set(draftData).then(function() { alert('Announcement & Popup saved to Draft!'); });
    };

    if(document.getElementById('saveDel')) document.getElementById('saveDel').onclick = function() {
      draftData.settings.shipCharge = Number(document.getElementById('setShipC').value);
      draftData.settings.freeShipAbove = Number(document.getElementById('setShipF').value);
      draftData.settings.codLimit = Number(document.getElementById('setCod').value);
      draftData.delivery.dispatch = document.getElementById('setDispatch').value;
      draftData.delivery.pincodes = document.getElementById('setPins').value.split(',').map(function(s) { return {pin:s.trim(), area:'India', days:3, cod:true}; }).filter(function(z) { return z.pin; });
      if (db) db.ref('draft').set(draftData).then(function() { alert('Delivery & PIN settings saved to Draft!'); });
    };

    if(document.getElementById('saveSettings')) document.getElementById('saveSettings').onclick = function() {
      draftData.settings.brand = document.getElementById('setBrand').value;
      draftData.settings.tagline = document.getElementById('setTag').value;
      draftData.settings.email = document.getElementById('setEmail').value;
      draftData.settings.phone = document.getElementById('setPhone').value;
      draftData.settings.whatsapp = document.getElementById('setWa').value;
      draftData.settings.hours = document.getElementById('setHours').value;
      draftData.settings.address = document.getElementById('setAddr').value;
      draftData.settings.instagram = document.getElementById('setIg').value;
      draftData.settings.facebook = document.getElementById('setFb').value;
      draftData.settings.youtube = document.getElementById('setYt').value;
      draftData.settings.amazonDisclaimer = document.getElementById('setAmz').value;
      if (db) db.ref('draft').set(draftData).then(function() { alert('Global store settings saved to Draft!'); });
    };

    if(document.getElementById('saveEmails')) document.getElementById('saveEmails').onclick = function() {
      draftData.emails.customerReply = document.getElementById('tplReply').value;
      draftData.emails.adminAlert = document.getElementById('tplAdmin').value;
      if (db) db.ref('draft').set(draftData).then(function() { alert('Email templates saved to Draft!'); });
    };

    if(document.getElementById('btnBackup')) document.getElementById('btnBackup').onclick = function() {
      var blob = new Blob([JSON.stringify(draftData, null, 2)], {type: "application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = `inari_life_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
    };

    if(document.getElementById('btnImport')) {
      document.getElementById('btnImport').onclick = function() { document.getElementById('fileIn').click(); };
      document.getElementById('fileIn').onchange = function(e) {
        var file = e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(evt) {
          try {
            var j = JSON.parse(evt.target.result);
            if(!j.products && !j.settings) throw new Error();
            if (db) db.ref('draft').set(j).then(function() { alert('JSON Backup imported to Draft successfully!'); });
          } catch(err) {
            alert('Invalid backup JSON file.');
          }
        };
        reader.readAsText(file);
      };
    }

    var dashPublish = document.getElementById('btnPublishDash');
    if(dashPublish) dashPublish.onclick = function() { document.getElementById('btnPublish').click(); };
  }

  // Generic Drawer Editor
  var editContext = { type: null, index: null, tempImages: [] };

  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
  document.getElementById('drCancel').onclick = closeDrawer;
  document.getElementById('drCloseX').onclick = closeDrawer;

  function renderImageGrid() {
    var html = '';
    editContext.tempImages.forEach(function(img, idx) {
      html += `
        <div class="img-tile">
          <img src="${img}" onerror="this.src='https://via.placeholder.com/92?text=Image'">
          <span class="seq">#${idx+1}</span>
          <button type="button" class="del" data-idx="${idx}" title="Remove image">✕</button>
          <div class="arrows">
            ${idx > 0 ? `<button type="button" class="mv-l" data-idx="${idx}">&larr;</button>` : ''}
            ${idx < editContext.tempImages.length - 1 ? `<button type="button" class="mv-r" data-idx="${idx}">&rarr;</button>` : ''}
          </div>
        </div>`;
    });
    var grid = document.getElementById('imgGrid');
    if(grid) {
      grid.innerHTML = html;
      document.querySelectorAll('.del').forEach(function(b) {
        b.onclick = function(e) {
          editContext.tempImages.splice(Number(e.target.getAttribute('data-idx')), 1);
          renderImageGrid();
        };
      });
      document.querySelectorAll('.mv-l').forEach(function(b) {
        b.onclick = function(e) {
          var idx = Number(e.target.getAttribute('data-idx'));
          var temp = editContext.tempImages[idx];
          editContext.tempImages[idx] = editContext.tempImages[idx - 1];
          editContext.tempImages[idx - 1] = temp;
          renderImageGrid();
        };
      });
      document.querySelectorAll('.mv-r').forEach(function(b) {
        b.onclick = function(e) {
          var idx = Number(e.target.getAttribute('data-idx'));
          var temp = editContext.tempImages[idx];
          editContext.tempImages[idx] = editContext.tempImages[idx + 1];
          editContext.tempImages[idx + 1] = temp;
          renderImageGrid();
        };
      });
    }
  }

  window.openEditor = function(type, i) {
    editContext.type = type;
    editContext.index = i;
    var html = '';

    // PRODUCT DRAWER
    if(type === 'product') {
      var p = i !== null ? draftData.products[i] : { name:'', price:0, mrp:0, stock:25, short:'', sku:'', badge:'', category:'home-organization', amazon:'', images:[] };
      editContext.tempImages = p.images ? p.images.slice() : (p.image ? [p.image] : []);
      var catOpts = (draftData.categories||[]).map(function(c) {
        return `<option value="${c.id}" ${p.category===c.id?'selected':''}>${c.name}</option>`;
      }).join('');

      html = `
        <label>Product Display Name</label>
        <input id="pName" value="${p.name || ''}" placeholder="e.g. 1-piece Cloth Organizer">

        <div class="grid-2">
          <div><label>Category</label><select id="pCat">${catOpts}</select></div>
          <div><label>SKU Code</label><input id="pSku" value="${p.sku || ''}"></div>
        </div>

        <div class="grid-3">
          <div><label>Selling Price (₹)</label><input id="pPrice" type="number" value="${p.price || 0}"></div>
          <div><label>MRP (₹)</label><input id="pMrp" type="number" value="${p.mrp || 0}"></div>
          <div><label>Inventory Stock</label><input id="pStock" type="number" value="${p.stock || 0}"></div>
        </div>

        <div class="grid-2">
          <div>
            <label>Badge</label>
            <select id="pBadge">
              <option value="" ${!p.badge?'selected':''}>No Badge</option>
              <option value="Bestseller" ${p.badge==='Bestseller'?'selected':''}>Bestseller</option>
              <option value="New" ${p.badge==='New'?'selected':''}>New</option>
              <option value="Sale" ${p.badge==='Sale'?'selected':''}>Sale</option>
              <option value="Popular" ${p.badge==='Popular'?'selected':''}>Popular</option>
            </select>
          </div>
          <div>
            <label>Amazon Buy Link</label>
            <input id="pAmz" value="${p.amazon || ''}" placeholder="https://www.amazon.in/dp/...">
          </div>
        </div>

        <label>Short Description</label>
        <textarea id="pShort" rows="3">${p.short || ''}</textarea>

        <label>Product Image Sequence Manager (Multi-Image)</label>
        <div style="display:flex;gap:8px;">
          <input id="imgTextInput" placeholder="Paste path (e.g. assets/images/item-1.jpg or URL)" style="margin-bottom:0;">
          <button type="button" class="btn btn-o" id="addPathBtn" style="white-space:nowrap;">+ Add Path</button>
        </div>
        <span class="hint">Paste relative paths from your GitHub Image Bank (e.g. <code>assets/images/product-1.jpg</code>) or direct URLs. Reorder using &larr; &rarr; arrows.</span>

        <div id="imgGrid" class="img-manager-grid"></div>

        <label style="font-size:12px;margin-top:6px;display:block;">Or upload directly from computer:</label>
        <input type="file" id="pFiles" multiple accept="image/*">
        <span id="upStat" style="font-size:12px;color:green;"></span>
      `;

      document.getElementById('drTitle').innerText = i !== null ? 'Edit Product' : 'Add New Product';
      document.getElementById('drBody').innerHTML = html;
      renderImageGrid();

      document.getElementById('addPathBtn').onclick = function() {
        var val = document.getElementById('imgTextInput').value.trim();
        if(val) {
          editContext.tempImages.push(val);
          document.getElementById('imgTextInput').value = '';
          renderImageGrid();
        }
      };

      document.getElementById('pFiles').onchange = function(e) {
        if (!storage) { alert("Storage is not initialized. Please paste path above."); return; }
        document.getElementById('upStat').innerText = 'Uploading...';
        var files = Array.from(e.target.files);
        var uploadNext = function(idx) {
          if (idx >= files.length) {
            document.getElementById('upStat').innerText = '';
            renderImageGrid();
            return;
          }
          var file = files[idx];
          var fileRef = storage.ref('uploads/' + Date.now() + '_' + file.name);
          fileRef.put(file).then(function(snapshot) {
            return snapshot.ref.getDownloadURL();
          }).then(function(url) {
            editContext.tempImages.push(url);
            uploadNext(idx + 1);
          }).catch(function(err) {
            alert('Upload notice: ' + err.message + '. Please use the "+ Add Path" button with assets/images/');
            uploadNext(idx + 1);
          });
        };
        uploadNext(0);
      };
    }

    // CATEGORY DRAWER
    else if(type === 'category') {
      var c = i !== null ? draftData.categories[i] : { id:'', name:'', blurb:'', icon:'grid', enabled:true };
      html = `
        <label>Category Slug / URL Identifier</label>
        <input id="cId" value="${c.id || ''}" placeholder="e.g. storage-travel">
        <label>Display Name</label>
        <input id="cName" value="${c.name || ''}" placeholder="e.g. Storage & Travel">
        <label>Blurb / Short Subtitle</label>
        <input id="cBlurb" value="${c.blurb || ''}" placeholder="e.g. Practical everyday organizers">
        <div class="grid-2">
          <div><label>Icon Key</label><input id="cIcon" value="${c.icon || 'grid'}"></div>
          <div>
            <label>Visibility</label>
            <select id="cEn">
              <option value="1" ${c.enabled!==false?'selected':''}>Active</option>
              <option value="0" ${c.enabled===false?'selected':''}>Hidden</option>
            </select>
          </div>
        </div>
      `;
      document.getElementById('drTitle').innerText = i !== null ? 'Edit Category' : 'Add Category';
      document.getElementById('drBody').innerHTML = html;
    }

    // BANNER DRAWER
    else if(type === 'banner') {
      var b = i !== null ? draftData.banners[i] : { eyebrow:'Home & Travel · 2026', title:'', subtitle:'', ctaText:'Shop the collection', ctaLink:'#/products', image:'' };
      editContext.tempImages = b.image ? [b.image] : [];
      html = `
        <label>Kicker / Eyebrow Header</label>
        <input id="bEye" value="${b.eyebrow || ''}" placeholder="e.g. Home & Travel · 2026">
        <label>Headline Title</label>
        <input id="bTitle" value="${b.title || ''}" placeholder="e.g. Smart storage, for everyday living.">
        <label>Sub-headline</label>
        <textarea id="bSub" rows="2">${b.subtitle || ''}</textarea>
        <div class="grid-2">
          <div><label>Button 1 Label</label><input id="bCta" value="${b.ctaText || 'Shop now'}"></div>
          <div><label>Button 1 Link</label><input id="bLink" value="${b.ctaLink || '#/products'}"></div>
        </div>

        <label>Banner Image (GitHub Image Bank Path or URL)</label>
        <input id="imgTextInput" placeholder="e.g. assets/images/hero-banner.jpg" value="${b.image || ''}">
        <span class="hint">Type or paste your path from the GitHub Image Bank (e.g. <code>assets/images/banner-1.jpg</code>).</span>

        <div id="imgGrid" class="img-manager-grid"></div>

        <label style="font-size:12px;margin-top:6px;display:block;">Or upload image file:</label>
        <input type="file" id="pFiles" accept="image/*">
        <span id="upStat" style="font-size:12px;color:green;"></span>
      `;
      document.getElementById('drTitle').innerText = i !== null ? 'Edit Banner Slider' : 'Add Banner Slider';
      document.getElementById('drBody').innerHTML = html;
      renderImageGrid();

      document.getElementById('imgTextInput').oninput = function(e) {
        var val = e.target.value.trim();
        editContext.tempImages = val ? [val] : [];
        renderImageGrid();
      };

      document.getElementById('pFiles').onchange = function(e) {
        if (!storage) { alert("Storage not initialized. Please paste path above."); return; }
        document.getElementById('upStat').innerText = 'Uploading...';
        var file = e.target.files[0];
        if(file) {
          var fileRef = storage.ref('uploads/' + Date.now() + '_' + file.name);
          fileRef.put(file).then(function(snapshot) {
            return snapshot.ref.getDownloadURL();
          }).then(function(url) {
            editContext.tempImages = [url];
            document.getElementById('imgTextInput').value = url;
            document.getElementById('upStat').innerText = '';
            renderImageGrid();
          }).catch(function(err) {
            alert('Upload notice: ' + err.message + '. Please use the path text field above.');
            document.getElementById('upStat').innerText = '';
          });
        }
      };
    }

    // OFFER DRAWER
    else if(type === 'offer') {
      var o = i !== null ? draftData.offers[i] : { code:'', kind:'Launch', title:'', detail:'', expiry:'' };
      html = `
        <div class="grid-2">
          <div><label>Coupon Code</label><input id="oCode" value="${o.code || ''}" placeholder="e.g. FIRST10"></div>
          <div><label>Kind / Tag</label><input id="oKind" value="${o.kind || 'Offer'}" placeholder="e.g. Launch, Seasonal"></div>
        </div>
        <label>Offer Headline</label>
        <input id="oTitle" value="${o.title || ''}" placeholder="e.g. Flat 10% off your first order">
        <label>Offer Terms / Conditions</label>
        <textarea id="oDet" rows="3">${o.detail || ''}</textarea>
        <label>Expiry Date</label>
        <input id="oExp" type="date" value="${o.expiry || ''}">
      `;
      document.getElementById('drTitle').innerText = i !== null ? 'Edit Coupon' : 'Create Coupon';
      document.getElementById('drBody').innerHTML = html;
    }

    // VIDEO DRAWER
    else if(type === 'video') {
      var vItem = i !== null ? draftData.videos[i] : { title:'', youtubeId:'', enabled:true };
      html = `
        <label>Video Title</label>
        <input id="vTitle" value="${vItem.title || ''}" placeholder="e.g. How to organize storage containers">
        <label>YouTube Video ID (11 Characters)</label>
        <input id="vId" value="${vItem.youtubeId || ''}" placeholder="e.g. dQw4w9WgXcQ">
        <label>Status</label>
        <select id="vEn">
          <option value="1" ${vItem.enabled!==false?'selected':''}>Visible</option>
          <option value="0" ${vItem.enabled===false?'selected':''}>Hidden</option>
        </select>
      `;
      document.getElementById('drTitle').innerText = i !== null ? 'Edit Video' : 'Add Video';
      document.getElementById('drBody').innerHTML = html;
    }

    // TESTIMONIAL DRAWER
    else if(type === 'testi') {
      var tItem = i !== null ? draftData.testimonials[i] : { name:'', city:'', text:'', stars:5 };
      html = `
        <div class="grid-2">
          <div><label>Customer Name</label><input id="tName" value="${tItem.name || ''}"></div>
          <div><label>City / Location</label><input id="tCity" value="${tItem.city || 'Greater Noida'}"></div>
        </div>
        <label>Rating (1 to 5 Stars)</label>
        <input id="tStars" type="number" min="1" max="5" value="${tItem.stars || 5}">
        <label>Testimonial Review</label>
        <textarea id="tText" rows="4">${tItem.text || ''}</textarea>
      `;
      document.getElementById('drTitle').innerText = i !== null ? 'Edit Testimonial' : 'Add Testimonial';
      document.getElementById('drBody').innerHTML = html;
    }

    document.getElementById('drawer').classList.add('open');
  };

  // Drawer Save Logic
  document.getElementById('drSave').onclick = function() {
    var t = editContext.type;
    var i = editContext.index;

    if(t === 'product') {
      var newP = {
        name: document.getElementById('pName').value.trim(),
        category: document.getElementById('pCat').value,
        sku: document.getElementById('pSku').value.trim(),
        price: Number(document.getElementById('pPrice').value),
        mrp: Number(document.getElementById('pMrp').value),
        stock: Number(document.getElementById('pStock').value),
        badge: document.getElementById('pBadge').value.trim(),
        amazon: document.getElementById('pAmz').value.trim(),
        short: document.getElementById('pShort').value.trim(),
        images: editContext.tempImages,
        image: editContext.tempImages[0] || ''
      };
      if(i !== null) draftData.products[i] = Object.assign({}, draftData.products[i], newP);
      else draftData.products.push(newP);
    }
    else if(t === 'category') {
      var newC = {
        id: document.getElementById('cId').value.trim(),
        name: document.getElementById('cName').value.trim(),
        blurb: document.getElementById('cBlurb').value.trim(),
        icon: document.getElementById('cIcon').value.trim(),
        enabled: document.getElementById('cEn').value === '1'
      };
      if(i !== null) draftData.categories[i] = Object.assign({}, draftData.categories[i], newC);
      else draftData.categories.push(newC);
    }
    else if(t === 'banner') {
      var directText = document.getElementById('imgTextInput') ? document.getElementById('imgTextInput').value.trim() : '';
      var chosenImg = directText || (editContext.tempImages.length > 0 ? editContext.tempImages[0] : '');
      var newB = {
        eyebrow: document.getElementById('bEye').value.trim(),
        title: document.getElementById('bTitle').value.trim(),
        subtitle: document.getElementById('bSub').value.trim(),
        ctaText: document.getElementById('bCta').value.trim(),
        ctaLink: document.getElementById('bLink').value.trim(),
        image: chosenImg,
        enabled: true
      };
      if(i !== null) draftData.banners[i] = Object.assign({}, draftData.banners[i], newB);
      else draftData.banners.push(newB);
    }
    else if(t === 'offer') {
      var newO = {
        code: document.getElementById('oCode').value.trim(),
        kind: document.getElementById('oKind').value.trim(),
        title: document.getElementById('oTitle').value.trim(),
        detail: document.getElementById('oDet').value.trim(),
        expiry: document.getElementById('oExp').value,
        enabled: true
      };
      if(i !== null) draftData.offers[i] = Object.assign({}, draftData.offers[i], newO);
      else draftData.offers.push(newO);
    }
    else if(t === 'video') {
      var newV = {
        title: document.getElementById('vTitle').value.trim(),
        youtubeId: document.getElementById('vId').value.trim(),
        enabled: document.getElementById('vEn').value === '1'
      };
      if(i !== null) draftData.videos[i] = Object.assign({}, draftData.videos[i], newV);
      else draftData.videos.push(newV);
    }
    else if(t === 'testi') {
      var newT = {
        name: document.getElementById('tName').value.trim(),
        city: document.getElementById('tCity').value.trim(),
        stars: Number(document.getElementById('tStars').value),
        text: document.getElementById('tText').value.trim(),
        enabled: true
      };
      if(i !== null) draftData.testimonials[i] = Object.assign({}, draftData.testimonials[i], newT);
      else draftData.testimonials.push(newT);
    }

    if (db) {
      db.ref('draft').set(draftData).then(function() {
        closeDrawer();
        renderView();
      });
    } else {
      closeDrawer();
      renderView();
    }
  };

  // Publish to Live
  document.getElementById('btnPublish').onclick = function() {
    if (!db) { alert("Database not initialized."); return; }
    if(confirm("Publish all Draft modifications to Live? Your customers will see the changes immediately upon page refresh.")) {
      db.ref('live').set(draftData).then(function() {
        alert("🎉 Successfully Published! Changes are now live on your storefront.");
      }).catch(function(err) { alert("Publish error: " + err.message); });
    }
  };
</script>
</body>
</html>
