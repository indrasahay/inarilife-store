<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inari Life - Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#1C2A43;--forest-2:#283A59;--sand:#F4F6F8;--cream:#FFFFFF;--ink:#1B1A17;--ink2:#4A473F;--line:rgba(28,42,67,.14);--ok:#2F7D4F;--warn:#D37A33;--bad:#A32B2B;--gold:#D37A33}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:#F2EEE4;color:var(--ink);font-size:14px;}
.gate{position:fixed;inset:0;background:var(--forest);display:grid;place-items:center;z-index:500;padding:20px;}
.gate-box{background:var(--cream);border-radius:16px;padding:34px 30px;max-width:400px;width:100%;}
input,select,textarea{width:100%;padding:9px;margin-bottom:12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;}
.btn{padding:9px 15px;border-radius:8px;font-weight:600;cursor:pointer;border:none;display:inline-flex;gap:8px;align-items:center;}
.btn-p{background:var(--forest);color:#fff;}
.btn-o{border:1px solid var(--line);background:#fff;color:var(--ink2);}
.btn-g{background:var(--gold);color:#fff;}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
.side{background:var(--forest);color:#fff;padding:20px 14px;display:flex;flex-direction:column;}
.nav{flex:1;overflow-y:auto;}
.nav button{display:block;width:100%;text-align:left;padding:10px 12px;background:none;border:none;color:#fff;cursor:pointer;margin-bottom:4px;border-radius:6px;}
.nav button:hover, .nav button.active{background:rgba(255,255,255,.15);}
.topbar{padding:16px 26px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.body{padding:24px 26px;overflow-y:auto;height:calc(100vh - 70px);}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;padding:18px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);}
th{font-weight:600;color:var(--ink2);}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:400;}
.drawer.open{display:block;}
.drawer-in{position:absolute;right:0;top:0;bottom:0;width:550px;background:#fff;display:flex;flex-direction:column;}
.drawer-b{padding:20px;overflow-y:auto;flex:1;}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#f9f9f9;}
.img-grid{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
.img-wrap{position:relative;width:80px;height:80px;border-radius:6px;border:1px solid var(--line);overflow:hidden;background:#fafafa;}
.img-wrap img{width:100%;height:100%;object-fit:cover;}
.img-wrap button{position:absolute;top:2px;right:2px;background:red;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:10px;padding:2px 6px;}
.field-hint{font-size:12px;color:#777;margin-top:-8px;margin-bottom:12px;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1 style="margin-top:0">Admin Login</h1>
    <input id="email" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Password">
    <button class="btn btn-p" style="width:100%" id="loginBtn">Login</button>
    <p id="loginErr" style="color:var(--bad);font-size:12px;margin-top:10px;"></p>
  </div>
</div>

<div class="shell" id="shell" style="display:none">
  <aside class="side">
    <div style="font-weight:bold;margin-bottom:20px;font-size:1.2rem;padding:0 10px;">INARI Admin</div>
    <nav class="nav" id="nav">
      <div style="font-size:11px;color:#aaa;text-transform:uppercase;margin:10px 0 5px 10px;letter-spacing:1px">Store</div>
      <button data-v="dash" class="active">Dashboard</button>
      <button data-v="sales">Orders / Enquiries</button>
      
      <div style="font-size:11px;color:#aaa;text-transform:uppercase;margin:20px 0 5px 10px;letter-spacing:1px">Catalog</div>
      <button data-v="products">Products</button>
      <button data-v="categories">Categories</button>
      
      <div style="font-size:11px;color:#aaa;text-transform:uppercase;margin:20px 0 5px 10px;letter-spacing:1px">Marketing</div>
      <button data-v="promotions">Banners & Popups</button>
      <button data-v="offers">Offers & Coupons</button>
      
      <div style="font-size:11px;color:#aaa;text-transform:uppercase;margin:20px 0 5px 10px;letter-spacing:1px">Configuration</div>
      <button data-v="delivery">PIN Codes & Delivery</button>
      <button data-v="settings">Site Settings</button>
      <button data-v="backup">Backup & Deploy</button>
    </nav>
    <div style="padding-top:20px;border-top:1px solid rgba(255,255,255,0.1)">
      <button id="logout" style="background:none;border:none;color:#aaa;cursor:pointer;width:100%;text-align:left;padding:10px;">Logout</button>
    </div>
  </aside>
  
  <div class="main">
    <div class="topbar">
      <h2 id="viewTitle" style="margin:0">Dashboard</h2>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-g" id="btnPublish">Publish to Live</button>
      </div>
    </div>
    <div class="body" id="view"></div>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-in">
    <div style="padding:20px;border-bottom:1px solid var(--line)"><h3 style="margin:0" id="drTitle">Edit</h3></div>
    <div class="drawer-b" id="drBody"></div>
    <div class="drawer-f">
      <button class="btn btn-o" id="drCancel">Cancel</button>
      <button class="btn btn-p" id="drSave">Save to Draft</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDWeKTJeS3jncsALs6Ub6PRJw54W3mBPws",
    authDomain: "inari-life.firebaseapp.com",
    databaseURL: "https://inari-life-default-rtdb.firebaseio.com",
    projectId: "inari-life",
    storageBucket: "inari-life.firebasestorage.app",
    messagingSenderId: "862496820163",
    appId: "1:862496820163:web:470581a2eff13802efcb76"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const storage = getStorage(app);

  let draftData = { products: [], categories: [], banners: [], offers: [], delivery: {pincodes:[]}, settings: {}, promotions: {} };
  let liveEnquiries = [];
  
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('shell').style.display = 'grid';
      loadDraftData();
      loadLiveEnquiries();
    } else {
      document.getElementById('gate').style.display = 'grid';
      document.getElementById('shell').style.display = 'none';
    }
  });

  document.getElementById('loginBtn').onclick = () => {
    signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pw').value)
      .catch(err => document.getElementById('loginErr').innerText = err.message);
  };
  document.getElementById('logout').onclick = () => signOut(auth);

  function loadDraftData() {
    onValue(ref(db, 'draft'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        draftData = Object.assign({ products: [], categories: [], banners: [], offers: [], delivery: {pincodes:[]}, settings: {}, promotions: {} }, data);
      }
      renderView();
    });
  }

  function loadLiveEnquiries() {
    onValue(ref(db, 'live/enquiries'), (snapshot) => {
      const data = snapshot.val();
      if (data) { liveEnquiries = Object.keys(data).map(k => ({id:k, ...data[k]})).reverse(); }
      if(currentView === 'sales') renderView();
    });
  }

  let currentView = 'dash';
  document.getElementById('nav').addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON') {
      document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentView = e.target.getAttribute('data-v');
      document.getElementById('viewTitle').innerText = e.target.innerText;
      renderView();
    }
  });

  function renderView() {
    const v = document.getElementById('view');
    let html = '';
    
    if(currentView === 'dash') {
      html = `<div class="card"><h3>System Status</h3><p>Connected to Firebase Live DB.</p></div>`;
    } 
    else if(currentView === 'sales') {
      html = `<div class="card"><h3>Customer Enquiries / Leads</h3>
        <table><thead><tr><th>Date</th><th>Name</th><th>Email/Phone</th><th>Message</th></tr></thead><tbody>`;
      liveEnquiries.forEach(eq => {
        html += `<tr><td>${new Date(eq.timestamp || Date.now()).toLocaleDateString()}</td><td>${eq.name}</td><td>${eq.contact}</td><td>${eq.message}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
    else if(currentView === 'products') {
      html = `<div class="card"><button class="btn btn-o" id="addProdBtn">+ Add Product</button><br><br>
        <table><thead><tr><th>Image</th><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody>`;
      (draftData.products||[]).forEach((p, i) => {
        let img = p.images && p.images.length > 0 ? p.images[0] : (p.image || 'https://via.placeholder.com/50');
        html += `<tr><td><img src="${img}" width="50" style="border-radius:4px" onerror="this.src='https://via.placeholder.com/50'"></td>
          <td><b>${p.name || 'Unnamed'}</b></td><td>${p.sku || ''}</td><td>₹${p.price || 0}</td><td>${p.stock || 0}</td>
          <td><button class="btn btn-sm btn-o edit-btn" data-type="product" data-i="${i}">Edit</button></td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
    else if(currentView === 'categories') {
      html = `<div class="card"><button class="btn btn-o" id="addCatBtn">+ Add Category</button><br><br>
        <table><thead><tr><th>ID (URL)</th><th>Name</th><th>Icon</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
      (draftData.categories||[]).forEach((c, i) => {
        html += `<tr><td>${c.id}</td><td>${c.name}</td><td>${c.icon}</td><td>${c.enabled?'Active':'Hidden'}</td>
          <td><button class="btn btn-sm btn-o edit-btn" data-type="category" data-i="${i}">Edit</button></td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
    else if(currentView === 'promotions') {
      let pop = (draftData.promotions && draftData.promotions.popup) ? draftData.promotions.popup : {};
      
      html = `
        <div class="card">
          <h3>Banners</h3>
          <button class="btn btn-o" id="addBannerBtn">+ Add Banner</button><br><br>
          <table><thead><tr><th>Image</th><th>Headline</th><th>Actions</th></tr></thead><tbody>`;
      (draftData.banners||[]).forEach((b, i) => {
        html += `<tr>
          <td><img src="${b.image || 'https://via.placeholder.com/100x50'}" width="100" style="border-radius:4px" onerror="this.src='https://via.placeholder.com/100x50'"></td>
          <td>${b.title || 'Untitled'}</td>
          <td><button class="btn btn-sm btn-o edit-btn" data-type="banner" data-i="${i}">Edit</button></td>
        </tr>`;
      });
      html += `</tbody></table></div>
        
        <div class="card">
          <h3>Promo Popup (Newsletter / Welcome Offer)</h3>
          <label>Popup Status</label>
          <select id="popEn">
            <option value="1" ${pop.enabled ? 'selected' : ''}>Enabled</option>
            <option value="0" ${!pop.enabled ? 'selected' : ''}>Disabled</option>
          </select>
          <label>Title</label>
          <input id="popTitle" value="${pop.title || ''}">
          <label>Body Text</label>
          <textarea id="popBody" rows="3">${pop.body || ''}</textarea>
          <label>Button Text</label>
          <input id="popBtn" value="${pop.button || ''}">
          <label>Coupon Code (Optional)</label>
          <input id="popCode" value="${pop.code || ''}">
          <button class="btn btn-p" id="savePop" style="margin-top:10px;">Save Popup Settings</button>
        </div>`;
    }
    else if(currentView === 'offers') {
      html = `<div class="card"><button class="btn btn-o" id="addOffBtn">+ Add Offer/Coupon</button><br><br>
        <table><thead><tr><th>Code</th><th>Title</th><th>Expiry</th><th>Actions</th></tr></thead><tbody>`;
      (draftData.offers||[]).forEach((o, i) => {
        html += `<tr><td><b>${o.code}</b></td><td>${o.title}</td><td>${o.expiry}</td>
          <td><button class="btn btn-sm btn-o edit-btn" data-type="offer" data-i="${i}">Edit</button></td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
    else if(currentView === 'delivery') {
      html = `<div class="card"><h3>Delivery & PIN Codes</h3>
        <label>Shipping Charge (Flat rate below free limit)</label>
        <input id="setShipC" type="number" value="${draftData.settings.shipCharge || 49}">
        <label>Free Shipping Above</label>
        <input id="setShipF" type="number" value="${draftData.settings.freeShipAbove || 499}">
        <label>COD Limit</label>
        <input id="setCod" type="number" value="${draftData.settings.codLimit || 5000}">
        <label>Serviceable PIN Codes (Comma separated list)</label>
        <textarea id="setPins" rows="4">${(draftData.delivery.pincodes||[]).map(z=>z.pin).join(', ')}</textarea>
        <button class="btn btn-p" id="saveDel">Save Delivery Settings</button></div>`;
    }
    else if(currentView === 'settings') {
      html = `
        <div class="card">
          <h3>Store Settings & Footer</h3>
          <label>Brand Name</label>
          <input id="setBrand" value="${draftData.settings.brand || ''}">
          <label>Email</label>
          <input id="setEmail" value="${draftData.settings.email || ''}">
          <label>Phone / WhatsApp</label>
          <input id="setPhone" value="${draftData.settings.phone || ''}">
          <label>Registered Address</label>
          <textarea id="setAddr" rows="3">${draftData.settings.address || ''}</textarea>
          <button class="btn btn-p" id="saveSettings" style="margin-top:10px;">Save Settings</button>
        </div>
      `;
    }
    else if(currentView === 'backup') {
      html = `<div class="card"><h3>Backup & Operations</h3>
        <p>Download your complete database as a JSON file.</p>
        <button class="btn btn-o" id="btnBackup">Download Backup</button>
      </div>`;
    }
    
    // Render and attach events
    v.innerHTML = html;

    document.querySelectorAll('.edit-btn').forEach(b => {
      b.onclick = (e) => openEditor(e.target.getAttribute('data-type'), e.target.getAttribute('data-i'));
    });
    
    if(document.getElementById('addProdBtn')) document.getElementById('addProdBtn').onclick = () => openEditor('product', null);
    if(document.getElementById('addCatBtn')) document.getElementById('addCatBtn').onclick = () => openEditor('category', null);
    if(document.getElementById('addBannerBtn')) document.getElementById('addBannerBtn').onclick = () => openEditor('banner', null);
    if(document.getElementById('addOffBtn')) document.getElementById('addOffBtn').onclick = () => openEditor('offer', null);
    
    if(document.getElementById('saveDel')) document.getElementById('saveDel').onclick = () => {
      draftData.settings.shipCharge = Number(document.getElementById('setShipC').value);
      draftData.settings.freeShipAbove = Number(document.getElementById('setShipF').value);
      draftData.settings.codLimit = Number(document.getElementById('setCod').value);
      let pins = document.getElementById('setPins').value.split(',').map(s=>({pin: s.trim(), area:'India', days:3, cod:true})).filter(z=>z.pin);
      draftData.delivery.pincodes = pins;
      set(ref(db, 'draft'), draftData).then(()=>alert('Delivery saved!'));
    };

    if(document.getElementById('saveSettings')) document.getElementById('saveSettings').onclick = () => {
      draftData.settings.brand = document.getElementById('setBrand').value;
      draftData.settings.email = document.getElementById('setEmail').value;
      draftData.settings.phone = document.getElementById('setPhone').value;
      draftData.settings.address = document.getElementById('setAddr').value;
      set(ref(db, 'draft'), draftData).then(()=>alert('Settings saved to draft!'));
    };

    if(document.getElementById('savePop')) document.getElementById('savePop').onclick = () => {
      if(!draftData.promotions) draftData.promotions = {};
      if(!draftData.promotions.popup) draftData.promotions.popup = {};
      
      draftData.promotions.popup.enabled = document.getElementById('popEn').value === '1';
      draftData.promotions.popup.title = document.getElementById('popTitle').value;
      draftData.promotions.popup.body = document.getElementById('popBody').value;
      draftData.promotions.popup.button = document.getElementById('popBtn').value;
      draftData.promotions.popup.code = document.getElementById('popCode').value;
      
      set(ref(db, 'draft'), draftData).then(()=>alert('Popup settings saved to draft!'));
    };

    if(document.getElementById('btnBackup')) document.getElementById('btnBackup').onclick = () => {
      const blob = new Blob([JSON.stringify(draftData, null, 2)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `inari_backup_${Date.now()}.json`; a.click();
    };
  }

  // Generic Editor Logic
  let editContext = { type: null, index: null, tempImages: [] };

  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
  document.getElementById('drCancel').onclick = closeDrawer;

  function renderImageGrid() {
      let html = '';
      editContext.tempImages.forEach((img, idx) => {
          html += `<div class="img-wrap"><img src="${img}" onerror="this.src='https://via.placeholder.com/80?text=Image'"><button type="button" class="del-img" data-idx="${idx}">✕</button></div>`;
      });
      const grid = document.getElementById('imgGrid');
      if(grid) {
        grid.innerHTML = html;
        document.querySelectorAll('.del-img').forEach(b => b.onclick = (e) => {
            editContext.tempImages.splice(e.target.getAttribute('data-idx'), 1);
            renderImageGrid();
            const textIn = document.getElementById('imgTextInput');
            if(textIn) textIn.value = editContext.tempImages[0] || '';
        });
      }
  }

  window.openEditor = function(type, i) {
    editContext.type = type;
    editContext.index = i;
    
    let html = '';
    
    if(type === 'product') {
      let p = i !== null ? draftData.products[i] : {name:'', price:0, mrp:0, stock:0, short:'', images:[]};
      editContext.tempImages = p.images ? [...p.images] : (p.image ? [p.image] : []);
      
      html = `
        <label>Name</label><input id="pName" value="${p.name || ''}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label>Price</label><input id="pPrice" type="number" value="${p.price}"></div>
            <div><label>MRP</label><input id="pMrp" type="number" value="${p.mrp}"></div>
        </div>
        <label>Stock</label><input id="pStock" type="number" value="${p.stock}">
        <label>Description</label><textarea id="pShort">${p.short || ''}</textarea>
        
        <label>Product Images</label>
        <label style="font-weight:normal;font-size:12px;">Type or Paste image path/URL below:</label>
        <div style="display:flex;gap:8px;">
          <input id="imgTextInput" placeholder="e.g. assets/images/product.jpg or https://..." style="margin-bottom:6px;">
          <button type="button" class="btn btn-o" id="addPathBtn" style="height:38px;">+ Add</button>
        </div>
        <div class="field-hint">Paste relative path from your GitHub Image Bank (e.g. assets/images/my-file.jpg)</div>
        
        <div id="imgGrid" class="img-grid"></div>
        
        <label style="font-weight:normal;font-size:12px;margin-top:10px;display:block;">Or upload directly from computer:</label>
        <input type="file" id="pFiles" multiple accept="image/*">
        <span id="upStat" style="font-size:12px;color:green;"></span>
      `;
      document.getElementById('drBody').innerHTML = html;
      renderImageGrid();

      document.getElementById('addPathBtn').onclick = () => {
        const val = document.getElementById('imgTextInput').value.trim();
        if(val) {
          editContext.tempImages.push(val);
          document.getElementById('imgTextInput').value = '';
          renderImageGrid();
        }
      };
      
      document.getElementById('pFiles').onchange = async (e) => {
          document.getElementById('upStat').innerText = 'Uploading...';
          for(let file of e.target.files) {
              try {
                const sRefObj = sRef(storage, 'uploads/' + Date.now() + '_' + file.name);
                await uploadBytesResumable(sRefObj, file);
                const url = await getDownloadURL(sRefObj);
                editContext.tempImages.push(url);
              } catch(err) {
                alert('Storage upload failed: ' + err.message + '. Please use the paste path option above.');
              }
          }
          document.getElementById('upStat').innerText = '';
          renderImageGrid();
      };
    } 
    else if(type === 'category') {
      let c = i !== null ? draftData.categories[i] : {id:'', name:'', icon:'leaf', enabled:true};
      html = `
        <label>ID (URL Slug)</label><input id="cId" value="${c.id || ''}">
        <label>Name</label><input id="cName" value="${c.name || ''}">
        <label>Icon Identifier</label><input id="cIcon" value="${c.icon || ''}">
        <label>Status</label>
        <select id="cEn"><option value="1" ${c.enabled?'selected':''}>Active</option><option value="0" ${!c.enabled?'selected':''}>Hidden</option></select>
      `;
      document.getElementById('drBody').innerHTML = html;
    }
    else if(type === 'banner') {
      let b = i !== null ? draftData.banners[i] : {title:'', subtitle:'', image:''};
      editContext.tempImages = b.image ? [b.image] : [];
      
      html = `
        <label>Headline</label><input id="bTitle" value="${b.title || ''}">
        <label>Sub-headline</label><textarea id="bSub">${b.subtitle || ''}</textarea>
        
        <label>Banner Image Path / URL</label>
        <input id="imgTextInput" placeholder="e.g. assets/images/hero-banner.jpg or https://..." value="${b.image || ''}">
        <div class="field-hint">Paste relative path from your GitHub Image Bank (e.g. <b>assets/images/your-banner.jpg</b>)</div>
        
        <div id="imgGrid" class="img-grid"></div>
        
        <label style="font-weight:normal;font-size:12px;margin-top:10px;display:block;">Or upload directly from computer:</label>
        <input type="file" id="pFiles" accept="image/*">
        <span id="upStat" style="font-size:12px;color:green;"></span>
      `;
      document.getElementById('drBody').innerHTML = html;
      renderImageGrid();

      // Whenever typing in input, update preview live
      document.getElementById('imgTextInput').oninput = (e) => {
        const val = e.target.value.trim();
        editContext.tempImages = val ? [val] : [];
        renderImageGrid();
      };
      
      document.getElementById('pFiles').onchange = async (e) => {
          document.getElementById('upStat').innerText = 'Uploading...';
          const file = e.target.files[0];
          if(file) {
              try {
                const sRefObj = sRef(storage, 'uploads/' + Date.now() + '_' + file.name);
                await uploadBytesResumable(sRefObj, file);
                const url = await getDownloadURL(sRefObj);
                editContext.tempImages = [url];
                document.getElementById('imgTextInput').value = url;
              } catch(err) {
                alert('Storage upload failed: ' + err.message + '. Please use the text field above to paste your GitHub Image Bank path.');
              }
          }
          document.getElementById('upStat').innerText = '';
          renderImageGrid();
      };
    }
    else if(type === 'offer') {
      let o = i !== null ? draftData.offers[i] : {code:'', title:'', detail:'', expiry:''};
      html = `
        <label>Coupon Code</label><input id="oCode" value="${o.code || ''}">
        <label>Title</label><input id="oTitle" value="${o.title || ''}">
        <label>Details</label><input id="oDet" value="${o.detail || ''}">
        <label>Expiry Date (YYYY-MM-DD)</label><input id="oExp" type="date" value="${o.expiry || ''}">
      `;
      document.getElementById('drBody').innerHTML = html;
    }

    document.getElementById('drawer').classList.add('open');
  }

  document.getElementById('drSave').onclick = () => {
    let t = editContext.type;
    let i = editContext.index;
    
    if(t === 'product') {
       let newP = {
           name: document.getElementById('pName').value,
           price: Number(document.getElementById('pPrice').value),
           mrp: Number(document.getElementById('pMrp').value),
           stock: Number(document.getElementById('pStock').value),
           short: document.getElementById('pShort').value,
           images: editContext.tempImages
       };
       if(i !== null) draftData.products[i] = {...draftData.products[i], ...newP};
       else draftData.products.push(newP);
    }
    else if(t === 'category') {
       let newC = {
           id: document.getElementById('cId').value,
           name: document.getElementById('cName').value,
           icon: document.getElementById('cIcon').value,
           enabled: document.getElementById('cEn').value === '1'
       };
       if(!draftData.categories) draftData.categories = [];
       if(i !== null) draftData.categories[i] = {...draftData.categories[i], ...newC};
       else draftData.categories.push(newC);
    }
    else if(t === 'banner') {
       const directText = document.getElementById('imgTextInput') ? document.getElementById('imgTextInput').value.trim() : '';
       const chosenImg = directText || (editContext.tempImages.length > 0 ? editContext.tempImages[0] : '');
       
       let newB = {
           title: document.getElementById('bTitle').value,
           subtitle: document.getElementById('bSub').value,
           image: chosenImg
       };
       if(!draftData.banners) draftData.banners = [];
       if(i !== null) draftData.banners[i] = {...draftData.banners[i], ...newB};
       else draftData.banners.push(newB);
    }
    else if(t === 'offer') {
       let newO = {
           code: document.getElementById('oCode').value,
           title: document.getElementById('oTitle').value,
           detail: document.getElementById('oDet').value,
           expiry: document.getElementById('oExp').value,
           enabled: true
       };
       if(!draftData.offers) draftData.offers = [];
       if(i !== null) draftData.offers[i] = {...draftData.offers[i], ...newO};
       else draftData.offers.push(newO);
    }
    
    set(ref(db, 'draft'), draftData);
    closeDrawer();
  };

  document.getElementById('btnPublish').onclick = () => {
    if(confirm("Push all draft changes to the live website?")) {
        set(ref(db, 'live'), draftData).then(() => alert("Published successfully!"));
    }
  };
</script>
</body>
</html>
