<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inari Life — Millets, Cold-Pressed Oils & Herbal Wellness</title>
<meta name="description" content="Inari Life: unpolished millets, wood-pressed oils and short-ingredient wellness. Shop on Amazon, or browse the full catalogue here." />
<meta property="og:title" content="Inari Life — Rooted in nature. Made for everyday." />
<meta property="og:description" content="Unpolished millets, cold-pressed oils and herbal wellness from small Indian farms." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C2A43'/%3E%3Cpath d='M16 25c0-6 3-10 9-11-1 7-4 10-9 11Z' fill='%23D37A33'/%3E%3Cpath d='M16 25c0-6-3-10-9-11 1 7 4 10 9 11Z' fill='%23E8D9A8'/%3E%3C/svg%3E">
<style>
/* ============ 1. TOKENS ============ */
:root{
  --forest:#1C2A43; --forest-2:#283A59; --forest-3:#111A29;
  --sand:#F4F6F8; --sand-2:#E9ECEF; --cream:#FFFFFF;
  --gold:#D37A33; --gold-soft:#EAA573;
  --ink:#1B1A17; --ink-2:#4A473F; --ink-3:#7C786D;
  --line:rgba(28,42,67,.14);
  --ok:#2F7D4F; --warn:#D37A33; --bad:#A32B2B;
  --r-sm:8px; --r:14px; --r-lg:22px;
  --sh-1:0 1px 2px rgba(28,42,67,.05), 0 4px 14px rgba(28,42,67,.05);
  --sh-2:0 10px 34px rgba(28,42,67,.10);
  --ff-d:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ff-b:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --wrap:1200px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--ff-b);background:var(--cream);color:var(--ink);font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,h4{font-family:var(--ff-d);font-weight:500;letter-spacing:-.015em;line-height:1.12;margin:0}
h1{font-size:clamp(2.1rem,4.6vw,3.75rem)}
h2{font-size:clamp(1.6rem,2.9vw,2.35rem)}
h3{font-size:1.12rem}
p{margin:0 0 1em}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 20px}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.eyebrow.dark{color:var(--forest-2)}
.lede{color:var(--ink-2);font-size:1.02rem;max-width:62ch}
.sec{padding:clamp(48px,6vw,86px) 0}
.sec-tight{padding:clamp(32px,4vw,54px) 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:34px;flex-wrap:wrap}
.sec-head .lede{margin:8px 0 0}
.link-arrow{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;color:var(--forest);border-bottom:1px solid var(--line);padding-bottom:2px;white-space:nowrap}
.link-arrow:hover{border-color:var(--forest)}
.link-arrow svg{width:14px;height:14px}
:focus-visible{outline:2px solid var(--forest);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:0;background:var(--forest);color:#fff;padding:10px 16px;z-index:300;border-radius:0 0 8px 0}
.skip:focus{left:0}

/* ============ 2. BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:100px;font-size:.875rem;font-weight:600;letter-spacing:.01em;transition:.2s ease;white-space:nowrap;border:1px solid transparent}
.btn svg{width:16px;height:16px;flex:none}
.btn-p{background:var(--forest);color:#fff}
.btn-p:hover{background:var(--forest-3);transform:translateY(-1px);box-shadow:var(--sh-2)}
.btn-gold{background:var(--gold);color:#221c05}
.btn-gold:hover{background:#d8b23a;transform:translateY(-1px)}
.btn-out{border-color:var(--forest);color:var(--forest)}
.btn-out:hover{background:var(--forest);color:#fff}
.btn-light{border-color:rgba(255,255,255,.42);color:#fff}
.btn-light:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn-amz{background:#FFD814;color:#0F1111;border-color:#FCD200;font-weight:700}
.btn-amz:hover{background:#F7CA00}
.btn-sm{padding:9px 16px;font-size:.8rem}
.btn-block{width:100%}

/* ============ 3. ANNOUNCEMENT + HEADER ============ */
.ann{background:var(--forest);color:#EDE4D4;font-size:.78rem;letter-spacing:.02em;text-align:center;padding:9px 16px;display:flex;justify-content:center;align-items:center;gap:10px}
.ann strong{color:var(--gold-soft);font-weight:600}
.ann .x{position:absolute;right:14px;opacity:.6;font-size:1rem;line-height:1}
.ann-wrap{position:relative;display:flex;align-items:center;justify-content:center}
header.site{position:sticky;top:0;z-index:60;background:rgba(252,250,245,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:26px;height:74px}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--forest);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-txt b{font-family:var(--ff-d);font-size:1.22rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.brand-txt span{font-size:.58rem;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
nav.main{display:flex;align-items:center;gap:4px;margin-left:6px}
nav.main a{padding:9px 12px;font-size:.855rem;font-weight:500;color:var(--ink-2);border-radius:8px;transition:.15s}
nav.main a:hover{color:var(--forest);background:var(--sand)}
nav.main a.on{color:var(--forest);font-weight:600}
.hd-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent;transition:.15s;position:relative}
.icon-btn:hover{background:var(--sand);color:var(--forest);border-color:var(--line)}
.icon-btn svg{width:19px;height:19px}
.hd-pin{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:100px;font-size:.78rem;font-weight:500;color:var(--ink-2);background:#fff}
.hd-pin svg{width:15px;height:15px;color:var(--forest)}
.burger{display:none}
/* search */
.searchbar{max-height:0;overflow:hidden;transition:max-height .3s ease;border-top:0 solid var(--line)}
.searchbar.open{max-height:110px;border-top:1px solid var(--line)}
.searchrow{display:flex;align-items:center;gap:12px;padding:14px 0}
.searchrow svg{width:19px;height:19px;color:var(--ink-3);flex:none}
.searchrow input{flex:1;border:0;background:none;font-size:1.02rem;color:var(--ink);outline:none;padding:8px 0}
.searchrow input::placeholder{color:var(--ink-3)}
/* mobile drawer */
.mnav{display:none;position:fixed;inset:0;z-index:100;background:rgba(18,40,27,.5);backdrop-filter:blur(3px)}
.mnav.open{display:block}
.mnav-panel{position:absolute;right:0;top:0;bottom:0;width:min(86vw,360px);background:var(--cream);padding:22px;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:slideIn .28s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.mnav-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mnav a{display:block;padding:13px 4px;font-size:1rem;font-weight:500;border-bottom:1px solid var(--line)}
.mnav .m-sub{padding-left:12px;font-size:.9rem;color:var(--ink-2);font-weight:400}

/* ============ 4. HERO CAROUSEL ============ */
.hero{position:relative;background:var(--forest);overflow:hidden}
.slide{display:none;position:relative}
.slide.on{display:block;animation:fade .55s ease}
@keyframes fade{from{opacity:0;transform:scale(1.01)}to{opacity:1;transform:none}}
.slide-grid{display:grid;grid-template-columns:1.05fr .95fr;min-height:min(560px,74vh);align-items:center;gap:30px}
.slide-copy{padding:clamp(34px,5vw,64px) 0;color:#fff;position:relative;z-index:2}
.slide-copy .eyebrow{color:var(--gold-soft)}
.slide-copy h1{color:#fff;margin-bottom:18px}
.slide-copy h1 br{display:block}
.slide-copy p{color:rgba(255,255,255,.78);font-size:1.02rem;max-width:46ch;margin-bottom:28px}
.slide-cta{display:flex;gap:12px;flex-wrap:wrap}
.slide-art{position:relative;align-self:stretch;min-height:320px;display:grid;place-items:center;padding:24px}
.slide-art::before{content:"";position:absolute;inset:8% 4%;border-radius:50% 50% 46% 54%/54% 46% 54% 46%;background:radial-gradient(circle at 30% 30%,rgba(232,217,168,.28),rgba(232,217,168,.05) 62%,transparent 70%);filter:blur(2px)}
.slide-art svg{width:min(100%,420px);height:auto;position:relative;filter:drop-shadow(0 22px 40px rgba(0,0,0,.28))}
.hero[data-theme="gold"]{background:linear-gradient(135deg,#8A6A12,#C9A227 60%,#E0BE49)}
.hero[data-theme="gold"] .slide-copy p{color:rgba(34,28,5,.78)}
.hero[data-theme="gold"] .slide-copy h1{color:#211b04}
.hero[data-theme="gold"] .eyebrow{color:#4a3a06}
.hero[data-theme="gold"] .btn-p{background:#211b04;color:#F6E9BE}
.hero[data-theme="gold"] .btn-light{border-color:rgba(33,27,4,.4);color:#211b04}
.hero[data-theme="sand"]{background:linear-gradient(135deg,#EDE4D4,#D9C9AC)}
.hero[data-theme="sand"] .slide-copy h1{color:var(--forest-3)}
.hero[data-theme="sand"] .slide-copy p{color:rgba(18,40,27,.72)}
.hero[data-theme="sand"] .eyebrow{color:#8A6A12}
.hero[data-theme="sand"] .slide-copy .btn-p{background:var(--forest)}
.hero[data-theme="sand"] .btn-light{border-color:rgba(18,40,27,.35);color:var(--forest-3)}
.hero-nav{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.dot{width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.34);transition:.25s}
.dot.on{background:#fff;width:40px}
.hero[data-theme="sand"] .dot{background:rgba(18,40,27,.24)}
.hero[data-theme="sand"] .dot.on{background:var(--forest)}
.hero[data-theme="gold"] .dot{background:rgba(33,27,4,.25)}
.hero[data-theme="gold"] .dot.on{background:#211b04}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;z-index:5;transition:.2s}
.hero-arrow:hover{background:rgba(255,255,255,.28)}
.hero-arrow.prev{left:14px}.hero-arrow.next{right:14px}
.hero-arrow svg{width:18px;height:18px}

/* ============ 5. PROMO STRIP ============ */
.promos{background:var(--sand);border-bottom:1px solid var(--line)}
.promo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.promo{display:flex;align-items:center;gap:13px;padding:19px 22px;border-right:1px solid var(--line)}
.promo:last-child{border-right:0}
.promo .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--forest)}
.promo .ic svg{width:22px;height:22px}
.promo b{display:block;font-size:.84rem;font-weight:600;line-height:1.3}
.promo span{font-size:.76rem;color:var(--ink-3)}

/* ============ 6. CATEGORIES ============ */
.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cat{position:relative;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:20px 16px;text-align:center;transition:.22s;overflow:hidden}
.cat:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:rgba(31,61,43,.3)}
.cat .ic{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--sand);color:var(--forest)}
.cat .ic svg{width:28px;height:28px}
.cat b{display:block;font-size:.86rem;font-weight:600;margin-bottom:2px}
.cat span{font-size:.72rem;color:var(--ink-3);line-height:1.4;display:block}
.cat .count{position:absolute;top:10px;right:12px;font-size:.66rem;color:var(--ink-3)}

/* ============ 7. PRODUCT CARDS ============ */
.p-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.22s;position:relative}
.card:hover{box-shadow:var(--sh-2);transform:translateY(-3px);border-color:rgba(31,61,43,.26)}
.card-media{position:relative;aspect-ratio:1/1;background:var(--sand);overflow:hidden;display:block}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .card-media img{transform:scale(1.045)}
.badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.bdg{font-size:.63rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:4px;background:var(--forest);color:#fff}
.bdg.gold{background:var(--gold);color:#241d05}
.bdg.warn{background:var(--warn);color:#fff}
.bdg.bad{background:#5c5952;color:#fff}
.card-body{padding:14px 15px 16px;display:flex;flex-direction:column;flex:1;background:#fff;position:relative;z-index:1}
.card-cat{font-size:.65rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.card h3{font-family:var(--ff-b);font-size:.9rem;font-weight:600;line-height:1.42;letter-spacing:0;margin:0 0 5px;color:var(--ink);display:block}
.card h3 a{color:var(--ink);display:inline;text-decoration:none}
.card h3 a:hover{color:var(--forest-2);text-decoration:underline}
.card .unit{font-size:.72rem;color:var(--ink-3);margin-bottom:9px}
.price-row{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.price{font-size:1.02rem;font-weight:700;letter-spacing:-.02em}
.mrp{font-size:.8rem;color:var(--ink-3);text-decoration:line-through}
.off{font-size:.72rem;font-weight:700;color:var(--ok)}
.stars{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-3);margin-bottom:12px}
.stars .s{color:var(--gold);letter-spacing:1px}
.card-actions{margin-top:auto;display:grid;gap:7px}
.stock-note{font-size:.72rem;margin-bottom:9px;display:flex;align-items:center;gap:5px}
.in-stock{color:var(--ok)}.low-stock{color:var(--warn)}.no-stock{color:var(--ink-3)}
.stock-note .dot-live{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
/* SVG placeholder artwork */
.ph{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.ph-in{position:relative;z-index:2;text-align:center;padding:16px}
.ph-in svg{width:52%;height:auto;margin:0 auto 10px;opacity:.92}
.ph-in b{display:block;font-family:var(--ff-d);font-size:.82rem;font-weight:600;color:rgba(255,255,255,.95);letter-spacing:.02em;line-height:1.25}
.ph-in i{display:block;font-style:normal;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:6px}
.ph-1{background:linear-gradient(150deg,#2C5740,#1F3D2B 62%,#173021)}
.ph-2{background:linear-gradient(150deg,#A8821C,#7C5F10 62%,#5C460A)}
.ph-3{background:linear-gradient(150deg,#6B8E6F,#43664A 62%,#2F4D35)}
.ph-4{background:linear-gradient(150deg,#A9744F,#7E5334 62%,#5C3A22)}
.ph-5{background:linear-gradient(150deg,#8E8A6B,#6A6650 62%,#4C4938)}
.ph-6{background:linear-gradient(150deg,#9A6B8E,#6E4A64 62%,#4E3347)}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 18%,rgba(255,255,255,.18),transparent 52%)}

/* ============ 8. DEALS BAND ============ */
.deals{background:var(--forest);color:#fff;position:relative;overflow:hidden}
.deals::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.18),transparent 66%);top:-160px;right:-90px}
.deals .sec-head h2{color:#fff}
.deals .lede{color:rgba(255,255,255,.7)}
.countdown{display:flex;gap:8px;align-items:center;margin-top:20px}
.cd-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:8px 12px;text-align:center;min-width:58px}
.cd-box b{display:block;font-family:var(--ff-d);font-size:1.3rem;line-height:1;color:#fff}
.cd-box span{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.58)}
.deals .card{background:rgba(255,255,255,.97)}

/* ============ 9. PIN CHECKER ============ */
.pinsec{background:var(--sand-2)}
.pinbox{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(24px,3.4vw,40px);display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;box-shadow:var(--sh-1)}
.pinform{display:flex;gap:10px;margin:20px 0 12px;flex-wrap:wrap}
.pinform input{flex:1;min-width:150px;padding:13px 16px;border:1px solid var(--line);border-radius:100px;font-size:.95rem;letter-spacing:.08em;outline:none;background:var(--cream)}
.pinform input:focus{border-color:var(--forest);background:#fff}
.pinresult{margin-top:6px;font-size:.86rem;min-height:24px}
.pinresult .ok{color:var(--ok);font-weight:600}
.pinresult .bad{color:var(--bad);font-weight:600}
.pin-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:.73rem;padding:6px 11px;border-radius:100px;background:var(--sand);border:1px solid var(--line);color:var(--ink-2);transition:.15s}
.chip:hover{background:var(--forest);color:#fff;border-color:var(--forest)}
.pin-side{border-left:1px solid var(--line);padding-left:36px}
.pin-side ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.pin-side li{display:flex;gap:12px;font-size:.85rem;color:var(--ink-2)}
.pin-side li svg{width:18px;height:18px;color:var(--forest);flex:none;margin-top:2px}
.pin-side li b{display:block;color:var(--ink);font-size:.85rem}

/* ============ 10. VIDEO ============ */
.vid-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.vid{border-radius:var(--r);overflow:hidden;background:#000;position:relative;aspect-ratio:16/9;border:1px solid var(--line)}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vid-thumb{position:relative;width:100%;height:100%;cursor:pointer;background:#12281B}
.vid-thumb img{width:100%;height:100%;object-fit:cover;opacity:.82;transition:.3s}
.vid-thumb:hover img{opacity:1;transform:scale(1.03)}
.vid-play{position:absolute;inset:0;display:grid;place-items:center}
.vid-play span{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.35);transition:.2s}
.vid-thumb:hover .vid-play span{transform:scale(1.08);background:#fff}
.vid-play svg{width:20px;height:20px;color:var(--forest);margin-left:3px}
.vid-cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;font-size:.8rem;font-weight:500}

/* ============ 11. ABOUT ============ */
.about{background:var(--cream)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,64px);align-items:center}
.about-art{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:380px;background:linear-gradient(150deg,#2C5740,#12281B);display:grid;place-items:center;padding:28px}
.about-art svg{width:88%;height:auto;opacity:.95}
.about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;border-top:1px solid var(--line);padding-top:24px}
.about-stats b{display:block;font-family:var(--ff-d);font-size:1.6rem;color:var(--forest);line-height:1}
.about-stats span{font-size:.74rem;color:var(--ink-3);letter-spacing:.04em}
.ticks{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:11px}
.ticks li{display:flex;gap:10px;font-size:.88rem;color:var(--ink-2)}
.ticks svg{width:17px;height:17px;color:var(--ok);flex:none;margin-top:3px}

/* ============ 12. TESTIMONIALS ============ */
.testi{background:var(--sand)}
.t-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;display:flex;flex-direction:column}
.tcard .s{color:var(--gold);letter-spacing:3px;font-size:.85rem;margin-bottom:12px}
.tcard p{font-size:.9rem;color:var(--ink-2);line-height:1.68;flex:1;margin-bottom:16px}
.tcard .who{display:flex;align-items:center;gap:11px;border-top:1px solid var(--line);padding-top:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:600;flex:none}
.tcard .who b{display:block;font-size:.82rem;line-height:1.2}
.tcard .who span{font-size:.72rem;color:var(--ink-3)}

/* ============ 13. NEWSLETTER + CONTACT ============ */
.news{background:var(--forest-3);color:#fff;text-align:center;position:relative;overflow:hidden}
.news::after{content:"";position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.13),transparent 62%);left:50%;top:100%;transform:translate(-50%,-50%)}
.news h2{color:#fff;position:relative}
.news p{color:rgba(255,255,255,.68);max-width:52ch;margin:12px auto 26px;position:relative}
.news-form{display:flex;gap:9px;max-width:470px;margin:0 auto;position:relative;flex-wrap:wrap}
.news-form input{flex:1;min-width:200px;padding:14px 20px;border-radius:100px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font-size:.9rem;outline:none}
.news-form input::placeholder{color:rgba(255,255,255,.5)}
.news-form input:focus{border-color:var(--gold-soft);background:rgba(255,255,255,.12)}
.news small{display:block;margin-top:14px;font-size:.72rem;color:rgba(255,255,255,.44);position:relative}
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ccard{border:1px solid var(--line);border-radius:var(--r);padding:24px;background:#fff}
.ccard .ic{width:40px;height:40px;border-radius:10px;background:var(--sand);display:grid;place-items:center;color:var(--forest);margin-bottom:14px}
.ccard .ic svg{width:20px;height:20px}
.ccard h3{font-family:var(--ff-b);font-size:.92rem;font-weight:600;margin-bottom:6px}
.ccard p,.ccard a{font-size:.85rem;color:var(--ink-2);line-height:1.6;margin:0}
.ccard a:hover{color:var(--forest);text-decoration:underline}

/* ============ 14. FOOTER ============ */
footer.site{background:var(--forest-3);color:rgba(255,255,255,.62);padding:56px 0 0;font-size:.83rem}
.f-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:36px;padding-bottom:40px}
footer.site h4{color:#fff;font-family:var(--ff-b);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700;margin-bottom:16px}
footer.site ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
footer.site a:hover{color:#fff}
.f-brand .brand-txt b{color:#fff}
.f-brand .brand-txt span{color:rgba(255,255,255,.4)}
.f-brand p{margin:16px 0;max-width:34ch;line-height:1.7}
.socials{display:flex;gap:9px}
.socials a{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;transition:.15s}
.socials a:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);color:#fff}
.socials svg{width:15px;height:15px}
.f-bot{border-top:1px solid rgba(255,255,255,.1);padding:20px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.74rem;color:rgba(255,255,255,.42)}
.f-note{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:12px 15px;font-size:.72rem;line-height:1.6;color:rgba(255,255,255,.5);margin-bottom:22px;display:flex;gap:10px}
.f-note svg{width:16px;height:16px;flex:none;color:var(--gold-soft);margin-top:1px}

/* ============ 15. MODAL / DRAWER ============ */
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(18,40,27,.55);backdrop-filter:blur(4px)}
.modal.open{display:flex;animation:fade .2s ease}
.modal-box{background:var(--cream);border-radius:var(--r-lg);max-width:880px;width:100%;max-height:90vh;overflow-y:auto;display:grid;grid-template-columns:.9fr 1.1fr;box-shadow:0 30px 80px rgba(0,0,0,.3);position:relative;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:5;border:1px solid var(--line)}
.modal-x svg{width:16px;height:16px}
.modal-art{position:relative;min-height:300px;background:var(--sand)}
.modal-body{padding:clamp(22px,3vw,34px)}
.modal-body h2{font-size:1.5rem;margin-bottom:8px}
.modal-body .price-row{margin:14px 0 6px}
.modal-body .price{font-size:1.45rem}
.modal-feats{list-style:none;padding:0;margin:18px 0;display:grid;gap:9px;border-top:1px solid var(--line);padding-top:18px}
.modal-feats li{display:flex;gap:9px;font-size:.84rem;color:var(--ink-2)}
.modal-feats svg{width:15px;height:15px;color:var(--ok);flex:none;margin-top:3px}
.modal-note{font-size:.72rem;color:var(--ink-3);line-height:1.55;background:var(--sand);border-radius:9px;padding:10px 12px;margin-top:14px}
.modal-btns{display:grid;gap:8px;margin-top:16px}

/* ============ 16. PAGES / LISTING ============ */
.page-hero{background:var(--sand);border-bottom:1px solid var(--line);padding:clamp(34px,4.4vw,58px) 0}
.crumbs{font-size:.74rem;color:var(--ink-3);margin-bottom:14px;display:flex;gap:7px;flex-wrap:wrap}
.crumbs a:hover{color:var(--forest)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.fchip{padding:8px 15px;border-radius:100px;border:1px solid var(--line);font-size:.8rem;font-weight:500;background:#fff;transition:.15s;color:var(--ink-2)}
.fchip:hover{border-color:var(--forest);color:var(--forest)}
.fchip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.sortwrap{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-3)}
.sortwrap select{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:.8rem;font-family:inherit;outline:none}
.empty{text-align:center;padding:70px 20px;color:var(--ink-3)}
.empty svg{width:44px;height:44px;margin:0 auto 16px;opacity:.4}
.prose{max-width:74ch;font-size:.95rem;line-height:1.78;color:var(--ink-2)}
.prose h3{font-size:1.15rem;color:var(--ink);margin:28px 0 10px}
.prose ul{padding-left:20px}
.prose li{margin-bottom:8px}
.prose p{margin-bottom:1.1em}
.offers-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.offer{display:flex;gap:18px;padding:24px;border:1px dashed rgba(31,61,43,.32);border-radius:var(--r);background:#fff;align-items:flex-start}
.offer .tag{flex:none;background:var(--sand);border-radius:9px;padding:10px 13px;text-align:center;min-width:98px}
.offer .tag b{display:block;font-family:var(--ff-b);font-size:.82rem;letter-spacing:.06em;color:var(--forest);font-weight:700}
.offer .tag span{font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.offer h3{font-family:var(--ff-b);font-size:.95rem;font-weight:600;margin-bottom:5px}
.offer p{font-size:.82rem;color:var(--ink-2);margin:0 0 7px}
.offer small{font-size:.72rem;color:var(--ink-3)}

/* ============ 17. TOAST / FAB ============ */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:var(--forest-3);color:#fff;padding:13px 22px;border-radius:100px;font-size:.84rem;z-index:200;opacity:0;transition:.3s;box-shadow:var(--sh-2);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.fab{position:fixed;right:18px;bottom:18px;z-index:90;display:grid;gap:10px}
.fab a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:#fff;box-shadow:var(--sh-2);transition:.2s}
.fab a:hover{transform:translateY(-2px) scale(1.04)}
.fab a.wa{background:#25D366;color:#fff}
.fab svg{width:23px;height:23px}
/* promo popup */
.ppop{position:fixed;inset:0;z-index:130;background:rgba(18,40,27,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
.ppop.open{display:flex}
.ppop-box{background:var(--cream);border-radius:var(--r-lg);max-width:420px;width:100%;padding:36px 30px;text-align:center;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:pop .3s ease}
.ppop-box h3{font-size:1.5rem;margin-bottom:10px}
.ppop-box p{font-size:.86rem;color:var(--ink-2)}
.ppop-code{font-family:var(--ff-d);font-size:1.35rem;letter-spacing:.16em;color:var(--forest);background:var(--sand);border:1px dashed rgba(31,61,43,.35);border-radius:10px;padding:12px;margin:16px 0;font-weight:600}

/* product detail */
.pd{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(24px,4vw,52px);align-items:start}
.pd-media{border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:1/1;background:var(--sand);border:1px solid var(--line)}

/* ============ 18. RESPONSIVE ============ */
@media (max-width:1080px){
  .p-grid{grid-template-columns:repeat(3,1fr)}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .f-grid{grid-template-columns:1.4fr 1fr 1fr}
  .promo-grid{grid-template-columns:repeat(2,1fr)}
  .promo:nth-child(2){border-right:0}
  .promo:nth-child(1),.promo:nth-child(2){border-bottom:1px solid var(--line)}
}
@media (max-width:900px){
  nav.main,.hd-pin{display:none}
  .burger{display:grid}
  .slide-grid{grid-template-columns:1fr;min-height:0}
  .slide-art{display:none}
  .slide-copy{padding:44px 0 64px}
  .about-grid,.pinbox{grid-template-columns:1fr}
  .pin-side{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:26px}
  .vid-grid{grid-template-columns:1fr 1fr}
  .t-grid{grid-template-columns:1fr}
  .modal-box,.pd{grid-template-columns:1fr}
  .modal-art{min-height:230px}
  .contact-grid{grid-template-columns:1fr}
  .offers-grid{grid-template-columns:1fr}
}
@media (max-width:680px){
  body{font-size:15px}
  .p-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .vid-grid{grid-template-columns:1fr}
  .promo-grid{grid-template-columns:1fr}
  .promo{border-right:0;border-bottom:1px solid var(--line)}
  .f-grid{grid-template-columns:1fr 1fr;gap:26px}
  .f-brand{grid-column:1/-1}
  .about-stats{grid-template-columns:1fr 1fr}
  .hd{height:64px;gap:14px}
  .brand-txt b{font-size:1.02rem}
  .card h3{font-size:.8rem;min-height:2.6em}
  .card-body{padding:11px 11px 13px}
  .hero-arrow{display:none}
  .sec-head{margin-bottom:24px}
  .f-bot{flex-direction:column;text-align:center}
  .pd{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------------- router ---------------- */
  function route() {
    var h = (location.hash || '#/').replace(/^#/, '');
    var parts = h.split('/').filter(Boolean);
    var main = document.getElementById('app');
    if (!parts.length) { main.innerHTML = renderHome(); afterHome(); setActive('home'); }
    else if (parts[0] === 'products') { main.innerHTML = renderProducts(); afterList(); setActive('products'); }
    else if (parts[0] === 'category' && parts[1]) { listState.cat = parts[1]; main.innerHTML = renderCategory(parts[1]); setActive('cat-' + parts[1]); }
    else if (parts[0] === 'product' && parts[1]) { main.innerHTML = renderProduct(parts[1]); setActive('products'); }
    else if (parts[0] === 'offers') { main.innerHTML = renderOffers(); setActive('offers'); }
    else if (parts[0] === 'contact') { main.innerHTML = renderContact(); setActive('contact'); }
    else if (parts[0] === 'page' && parts[1]) { main.innerHTML = renderPage(parts[1]); setActive('page-' + parts[1]); }
    else { main.innerHTML = pageHero('404', 'Page not found', 'That link does not exist. Try the shop.') + '<section class="sec"><div class="wrap"><a class="btn btn-p" href="#/">Go home</a></div></section>'; }
    window.scrollTo(0, 0);
  }
  function renderHome() {
    return heroHTML() + promosHTML() + catsHTML() + dealsHTML() + aboutHTML() + pinHTML() + videoHTML() + testiHTML() + newsHTML();
  }
  function setActive(k) {
    var links = document.querySelectorAll('nav.main a');
    for (var i = 0; i < links.length; i++) links[i].classList.toggle('on', links[i].getAttribute('data-r') === k);
  }

  /* ---------------- interactions ---------------- */
  function afterHome() { carousel(); countdown(); pinCheck(); videoLazy(); }

  function afterList() {
    var chips = document.querySelectorAll('[data-fcat]');
    for (var i = 0; i < chips.length; i++) {
      (function (b) {
        b.onclick = function () {
          listState.cat = b.getAttribute('data-fcat');
          document.getElementById('gridWrap').innerHTML = gridHTML();
          for (var k = 0; k < chips.length; k++) chips[k].classList.toggle('on', chips[k] === b);
        };
      })(chips[i]);
    }
    var sel = document.getElementById('sortSel');
    if (sel) sel.onchange = function () { listState.sort = sel.value; document.getElementById('gridWrap').innerHTML = gridHTML(); };
  }

  function carousel() {
    var hero = document.getElementById('hero');
    if (!hero) return;
    var slides = hero.querySelectorAll('.slide'), dots = hero.querySelectorAll('.dot');
    if (slides.length < 2) return;
    var themes = (D.banners || []).filter(function (b) { return b.enabled !== false; }).map(function (b) { return b.theme || 'forest'; });
    var i = 0, timer = null;
    function go(n) {
      i = (n + slides.length) % slides.length;
      for (var k = 0; k < slides.length; k++) slides[k].classList.toggle('on', k === i);
      for (var d = 0; d < dots.length; d++) dots[d].classList.toggle('on', d === i);
      hero.setAttribute('data-theme', themes[i] || 'forest');
    }
    function start() { stop(); timer = setInterval(function () { go(i + 1); }, 6500); }
    function stop() { if (timer) clearInterval(timer); }
    var pv = document.getElementById('hPrev'), nx = document.getElementById('hNext');
    if (pv) pv.onclick = function () { go(i - 1); start(); };
    if (nx) nx.onclick = function () { go(i + 1); start(); };
    for (var d2 = 0; d2 < dots.length; d2++) (function (dd, k) { dd.onclick = function () { go(k); start(); }; })(dots[d2], d2);
    hero.addEventListener('mouseenter', stop); hero.addEventListener('mouseleave', start);
    start();
  }

  function countdown() {
    var el = document.getElementById('cd');
    if (!el) return;
    var end = new Date(el.getAttribute('data-ends')).getTime();
    if (!end) return;
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function tick() {
      var d = Math.max(0, end - Date.now());
      var set = function (id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
      set('cdD', Math.floor(d / 864e5)); set('cdH', pad(Math.floor(d % 864e5 / 36e5)));
      set('cdM', pad(Math.floor(d % 36e5 / 6e4))); set('cdS', pad(Math.floor(d % 6e4 / 1e3)));
    }
    tick(); setInterval(tick, 1000);
  }

  function pinCheck() {
    var input = document.getElementById('pinInput'), out = document.getElementById('pinResult'), go = document.getElementById('pinGo');
    if (!input || !out) return;
    var zones = (D.delivery || {}).pincodes || [];
    function check(pin) {
      pin = String(pin || '').replace(/\D/g, '');
      if (pin.length !== 6) { out.innerHTML = '<span class="bad">Please enter a valid 6-digit PIN code.</span>'; return; }
      var hit = null;
      for (var i = 0; i < zones.length; i++) {
        var z = String(zones[i].pin);
        if (z.length <= 6 && pin.indexOf(z) === 0) { hit = zones[i]; break; }
      }
      if (hit) {
        out.innerHTML = '<span class="ok">&#10003; Delivers to ' + esc(hit.area) + '</span><br>' +
          '<span style="color:var(--ink-2);font-size:.82rem">Estimated delivery in ' + esc(hit.days) + ' days &middot; ' +
          (hit.cod ? 'Cash on delivery available' : 'Prepaid only') + ' &middot; ' +
          (Number(hit.charge) === 0 ? 'Free shipping' : money(hit.charge) + ' shipping') + (hit.note ? ' &middot; ' + esc(hit.note) : '') + '</span>';
      } else {
        out.innerHTML = '<span class="bad">' + esc((D.delivery || {}).notServiceable || 'We do not deliver to this PIN code yet.') + '</span><br>' +
          '<span style="color:var(--ink-2);font-size:.82rem">Write to ' + esc(S.email) + ' and we will tell you when your area opens up.</span>';
      }
    }
    go.onclick = function () { check(input.value); };
    input.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); check(input.value); } };
    var chips = document.querySelectorAll('[data-pin]');
    for (var i = 0; i < chips.length; i++) (function (c) {
      c.onclick = function () { input.value = c.getAttribute('data-pin'); check(input.value); };
    })(chips[i]);
  }

  function videoLazy() {
    var boxes = document.querySelectorAll('.vid');
    for (var i = 0; i < boxes.length; i++) (function (box) {
      var thumb = box.querySelector('.vid-thumb');
      if (!thumb) return;
      function play() {
        var id = box.getAttribute('data-yt');
        box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0" title="Recipe video" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe>';
      }
      thumb.onclick = play;
      thumb.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } };
    })(boxes[i]);
  }

  /* ---------------- shell events ---------------- */
  function closeMnav() {
    var m = document.getElementById('mnav');
    if (m) m.classList.remove('open');
    document.body.style.overflow = '';
  }

  function bindShell() {
    var sb = document.getElementById('searchbar'), si = document.getElementById('searchInput'), sbtn = document.getElementById('searchBtn');
    if (sbtn) sbtn.onclick = function () {
      var open = sb.classList.toggle('open');
      sbtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open && si) setTimeout(function () { si.focus(); }, 120);
    };
    function doSearch() {
      var q = (si.value || '').trim();
      if (!q) return;
      listState.q = q; listState.cat = '';
      location.hash = '#/products';
      setTimeout(function () {
        var wrap = document.getElementById('gridWrap');
        if (wrap) { wrap.innerHTML = gridHTML(); afterList(); }
        var h = document.querySelector('#app h1');
        if (h) h.textContent = 'Results for \u201C' + q + '\u201D';
      }, 60);
    }
    var go = document.getElementById('searchGo'); if (go) go.onclick = doSearch;
    if (si) si.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } };

    var burger = document.getElementById('burger'), mnav = document.getElementById('mnav');
    if (burger) burger.onclick = function () { mnav.classList.add('open'); document.body.style.overflow = 'hidden'; };
    if (mnav) mnav.onclick = function (e) { if (e.target === mnav) closeMnav(); };
    var mx = document.getElementById('mnavX'); if (mx) mx.onclick = closeMnav;

    var ax = document.getElementById('annX');
    if (ax) ax.onclick = function () { document.getElementById('annBar').innerHTML = ''; };

    var nf = document.getElementById('newsForm');
    if (nf) nf.onsubmit = function (e) {
      e.preventDefault();
      toast('Thanks! In production, connect this form to Mailchimp or a Google Sheet.');
      nf.reset();
    };
    window.addEventListener('hashchange', function () { closeMnav(); route(); });
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('on'); }, 3600);
  }

  function popup() {
    var P = (D.promotions && D.promotions.popup) || {};
    if (!P.enabled) return;
    try { if (sessionStorage.getItem('inari_pop')) return; } catch (e) {}
    var wrap = document.getElementById('ppop');
    wrap.innerHTML = '<div class="ppop-box"><button class="modal-x" id="ppX" aria-label="Close">' + ic('x') + '</button>' +
      '<p class="eyebrow">' + esc(S.brand || 'Inari Life') + '</p><h3>' + esc(P.title) + '</h3><p>' + esc(P.body) + '</p>' +
      '<div class="ppop-code">' + esc(P.code) + '</div>' +
      '<button class="btn btn-p btn-block" id="ppCta">' + esc(P.button || 'Claim code') + '</button>' +
      '<p style="font-size:.7rem;color:var(--ink-3);margin:12px 0 0">No thanks, <button id="ppNo" style="text-decoration:underline">continue browsing</button></p></div>';
    setTimeout(function () { wrap.classList.add('open'); }, Math.max(1, Number(P.delay) || 6) * 1000);
    function close() { wrap.classList.remove('open'); try { sessionStorage.setItem('inari_pop', '1'); } catch (e) {} }
    document.getElementById('ppX').onclick = close;
    document.getElementById('ppNo').onclick = close;
    document.getElementById('ppCta').onclick = function () {
      close(); toast('Code ' + P.code + ' copied');
      try { navigator.clipboard.writeText(P.code); } catch (e) {}
    };
    wrap.onclick = function (e) { if (e.target === wrap) close(); };
  }

  function boot() {
    renderShell();
    route();
    bindShell();
    popup();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { loadData(boot); });
  else loadData(boot);
})();

</script>
